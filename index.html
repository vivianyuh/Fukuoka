<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>福岡・北九州 六天五夜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1ECE1;
    --panel:#FBF8F2;
    --ink:#1F2A3C;
    --ink-soft:#5B6474;
    --line:rgba(31,42,60,0.14);
    --vermilion:#C1440E;
    --moss:#5B7553;
    --gold:#B98A2E;
    --steel:#3E6285;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(circle at 10% 0%, rgba(62,98,133,0.06), transparent 40%),
      radial-gradient(circle at 90% 10%, rgba(193,68,14,0.05), transparent 35%);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    padding:28px 16px 60px;
    min-height:100vh;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:760px; margin:0 auto;}
  @media (max-width:400px){
    body{padding:18px 10px 50px;}
  }

  /* header */
  header{
    border-bottom:2px solid var(--ink);
    padding-bottom:18px;
    margin-bottom:22px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:12px;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.18em;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  h1{
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    font-size:clamp(28px,6vw,38px);
    margin:0;
    letter-spacing:0.02em;
  }
  .flight-badge{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    background:var(--ink);
    color:var(--bg);
    padding:8px 12px;
    border-radius:2px;
    text-align:right;
    line-height:1.6;
  }
  .flight-badge b{color:#F4C97B; font-weight:700;}

  /* day tabs — departure board style */
  .board{
    display:flex;
    gap:6px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    padding:6px 2px 10px;
    margin:0 -2px 24px;
    scrollbar-width:thin;
    position:sticky;
    top:0;
    z-index:10;
    background:var(--bg);
  }
  .board::-webkit-scrollbar{height:4px;}
  .tab{
    flex:0 0 auto;
    background:var(--panel);
    border:1px solid var(--line);
    border-bottom:3px solid transparent;
    border-radius:3px 3px 0 0;
    padding:12px 14px;
    cursor:pointer;
    min-width:96px;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    transition:all .18s ease;
  }
  .tab:hover{background:var(--white);}
  .tab.active{
    background:var(--ink);
    border-bottom:3px solid var(--vermilion);
  }
  .tab .d-num{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.1em;
    color:var(--ink-soft);
  }
  .tab.active .d-num{color:#B7C2D6;}
  .tab .d-date{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:15px;
    margin:2px 0 3px;
  }
  .tab.active .d-date{color:var(--bg);}
  .tab .d-theme{
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .tab.active .d-theme{color:#D7DCE5;}

  /* day panel */
  .panel{display:none;}
  .panel.active{display:block; animation:fade .35s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  .day-title{
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    font-size:22px;
    margin:0 0 2px;
  }
  .day-sub{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:20px;
    display:block;
  }

  /* timeline */
  .timeline{position:relative; padding-left:26px;}
  .timeline::before{
    content:"";
    position:absolute; left:6px; top:6px; bottom:6px;
    width:2px;
    background:repeating-linear-gradient(var(--line) 0 6px, transparent 6px 10px);
  }
  .stop{position:relative; margin-bottom:18px;}
  .stop::before{
    content:"";
    position:absolute; left:-26px; top:5px;
    width:10px; height:10px;
    border-radius:50%;
    background:var(--bg);
    border:2px solid var(--accent, var(--steel));
  }
  .stop-time{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:15px;
    color:var(--accent, var(--steel));
  }
  .stop-place{font-weight:700; font-size:15px; margin:2px 0 3px;}
  .stop-note{font-size:13px; color:var(--ink-soft); line-height:1.55;}
  .map-link{
    display:inline-flex;
    align-items:center;
    gap:3px;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    font-weight:700;
    color:var(--accent, var(--steel));
    text-decoration:none;
    border:1px solid currentColor;
    border-radius:10px;
    padding:4px 9px 4px 6px;
    margin-left:6px;
    vertical-align:middle;
    white-space:nowrap;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .map-link:hover{background:currentColor; color:var(--white) !important;}
  .map-link svg{width:9px; height:9px; flex:none;}
  .leg .p .map-link{margin-left:6px;}
  .tag{
    display:inline-block;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.06em;
    padding:2px 7px;
    border-radius:2px;
    color:var(--white);
    background:var(--accent, var(--steel));
    margin-right:6px;
    vertical-align:middle;
  }

  /* plan card */
  .plan-block{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:14px 16px;
    margin:10px 0 18px;
  }
  .plan-head{
    display:flex; gap:8px; margin-bottom:10px;
  }
  .plan-btn{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    font-weight:700;
    padding:8px 14px;
    border-radius:14px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink-soft);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .plan-btn.on{
    background:var(--ink);
    color:var(--bg);
    border-color:var(--ink);
  }
  .plan-body{display:none; font-size:13.5px; line-height:1.9;}
  .plan-body.on{display:block;}
  .leg{
    display:flex; justify-content:space-between; gap:10px;
    border-bottom:1px dashed var(--line);
    padding:4px 0;
  }
  .leg:last-child{border-bottom:none;}
  .leg .t{font-family:'JetBrains Mono', monospace; font-weight:700; white-space:nowrap;}
  .leg .p{color:var(--ink-soft); text-align:right;}

  .fare{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    background:#FBF3E4;
    border:1px dashed var(--gold);
    color:#7A5A17;
    padding:8px 12px;
    border-radius:4px;
    margin-top:8px;
  }
  .note-box{
    font-size:13px;
    color:var(--ink-soft);
    background:rgba(62,98,133,0.06);
    border-left:3px solid var(--steel);
    padding:8px 12px;
    border-radius:0 4px 4px 0;
    margin:10px 0;
  }

  /* meal recommendations */
  .meal-section{margin:22px 0 6px;}
  .meal-heading{
    display:flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .meal-heading::before{content:"";flex:0 0 14px; height:1px; background:var(--line);}
  .meal-heading::after{content:"";flex:1 1 auto; height:1px; background:var(--line);}
  .meal-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:3px solid var(--accent, var(--gold));
    border-radius:0 6px 6px 0;
    padding:12px 14px;
    margin-bottom:10px;
  }
  .meal-card-head{
    display:flex; justify-content:space-between; align-items:baseline; gap:8px;
    flex-wrap:wrap;
  }
  .meal-name{font-weight:700; font-size:14.5px;}
  .meal-type{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:var(--accent, var(--gold));
    letter-spacing:0.06em;
  }
  .meal-note{font-size:12.5px; color:var(--ink-soft); margin-top:4px; line-height:1.6;}
  .meal-tbd{
    font-size:12.5px;
    color:var(--ink-soft);
    font-style:italic;
    padding:10px 2px;
  }

  /* prep checklist */
  .tab.prep-tab{border-bottom-color:transparent;}
  .tab.prep-tab.active{border-bottom-color:var(--gold);}
  .prep-group{margin-bottom:22px;}
  .prep-group-title{
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    font-size:16px;
    margin-bottom:10px;
    display:flex; align-items:center; gap:8px;
  }
  .prep-group-title .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--accent, var(--gold));
    flex:none;
  }
  .prep-item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:12px 6px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .prep-group-body{
    display:grid;
    grid-template-columns:1fr 1fr;
    column-gap:18px;
  }
  .prep-group-body.cols-3{grid-template-columns:1fr 1fr 1fr;}
  .prep-group-body .prep-item:nth-last-child(1),
  .prep-group-body .prep-item:nth-last-child(2):nth-child(odd){
    border-bottom:none;
  }
  .prep-group-body.cols-3 .prep-item{border-bottom:1px solid var(--line);}
  @media (max-width:640px){
    .prep-group-body.cols-3{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:520px){
    .prep-group-body{grid-template-columns:1fr !important;}
    .prep-group-body .prep-item{border-bottom:1px solid var(--line);}
    .prep-group-body .prep-item:last-child{border-bottom:none;}
  }
  .prep-item:last-child{border-bottom:none;}
  .prep-check{
    flex:none;
    width:20px; height:20px;
    border:1.5px solid var(--ink-soft);
    border-radius:5px;
    margin-top:1px;
    position:relative;
    transition:all .15s ease;
  }
  .prep-item.checked .prep-check{
    background:var(--moss);
    border-color:var(--moss);
  }
  .prep-item.checked .prep-check::after{
    content:"";
    position:absolute; left:6px; top:2px;
    width:6px; height:11px;
    border:solid var(--white);
    border-width:0 2px 2px 0;
    transform:rotate(40deg);
  }
  .prep-text{flex:1;}
  .prep-item.checked .prep-main{
    color:var(--ink-soft);
    text-decoration:line-through;
    text-decoration-color:rgba(91,100,116,0.5);
  }
  .prep-main{font-size:14px; font-weight:500;}
  .prep-detail{font-size:12.5px; color:var(--ink-soft); margin-top:2px; line-height:1.55;}
  .prep-priority{
    font-family:'JetBrains Mono', monospace;
    font-size:9.5px;
    letter-spacing:0.06em;
    color:var(--vermilion);
    border:1px solid var(--vermilion);
    border-radius:3px;
    padding:1px 5px;
    margin-left:6px;
    white-space:nowrap;
  }

  /* hotel card */
  .hotel-card{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    background:var(--panel);
    border:1px solid var(--line);
    border-left:3px solid var(--moss);
    border-radius:0 6px 6px 0;
    padding:12px 16px;
    margin-bottom:22px;
  }
  .hotel-left{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .hotel-icon{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.08em;
    color:var(--moss);
    border:1px solid var(--moss);
    border-radius:3px;
    padding:2px 6px;
    flex:none;
  }
  .hotel-name{font-weight:700; font-size:14.5px;}
  .hotel-address{font-size:12px; color:var(--ink-soft);}
  .hotel-right{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    text-align:right;
    white-space:nowrap;
  }
  .hotel-right b{color:var(--ink);}
  .placeholder{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-soft);
    border:1.5px dashed var(--line);
    border-radius:8px;
  }
  .placeholder .big{
    font-family:'Noto Serif JP', serif;
    font-size:20px;
    color:var(--ink);
    margin-bottom:8px;
  }
  footer{
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:40px;
    letter-spacing:0.08em;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="eyebrow">KYUSHU · FUKUOKA ITINERARY</div>
      <h1>福岡・北九州</h1>
    </div>
    <div class="flight-badge">
      BR106&nbsp; TPE 08:00 → FUK 11:15<br>
      <b>11/6 (五) — 11/11 (三)</b> · 六天五夜
    </div>
  </header>

  <div class="hotel-card" id="hotel-card"></div>

  <div class="board" id="board"></div>
  <div id="panels"></div>

  <footer>行程可能隨天氣與現場狀況調整・出發前請再次確認車次時刻</footer>
</div>

<script>
function mapA(query){
  const url = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query);
  return `<a class="map-link" href="${url}" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>地圖</a>`;
}
function linkA(label, url){
  return `<a class="map-link" href="${url}" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M8 7V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-2M6 21a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2z"/></svg>${label}</a>`;
}

const hotelCard = document.getElementById('hotel-card');
hotelCard.innerHTML = `
  <div class="hotel-left">
    <span class="hotel-icon">住宿</span>
    <div>
      <div class="hotel-name">THE BASICS FUKUOKA${mapA('THE BASICS FUKUOKA')}</div>
      <div class="hotel-address">福岡県福岡市博多区博多駅東2-14-1（博多站步行約7分鐘）</div>
    </div>
  </div>
  <div class="hotel-right">Check-in <b>15:00</b>　Check-out <b>11:00</b></div>
`;

const prep = [
  {
    title:"交通預訂", accent:"var(--steel)",
    items:[
      {text:"由布院之森 / 由布號 特急指定席預約（11/8）", detail:"熱門觀光列車，旺季常額滿，建議提前 1 個月開放訂票時就先預約去回程座位。", priority:"必辦"},
      {text:"確認太宰府觀光列車「旅人 tabito」最新時刻（11/7）", detail:"", priority:""},
      {text:"評估是否購買 JR Kyushu Mobile Pass 福岡廣域版（11/9 門司港・皿倉山）", detail:"若當天會搭多段 JR，可比較單程票與周遊券何者划算。", priority:""},
      {text:"確認 11/6 昭和巴士（West Coast Liner）最新去回程時刻", detail:"Plan A／Plan B 皆需再核對，避免錯過末班車。", priority:""},
      {text:"IC 卡（Suica/ICOCA 等）儲值或準備手機 Mobile IC", detail:"巴士、地鐵、部分店家皆可使用，建議多留一些餘額備用。", priority:""}
    ]
  },
  {
    title:"證件與金錢", accent:"var(--vermilion)",
    items:[
      {text:"護照效期確認（建議 6 個月以上）", detail:"", priority:"必辦"},
      {text:"護照、機票、訂房證明各留一份電子備份", detail:"存雲端或手機相簿，遺失時方便處理。", priority:""},
      {text:"兌換日圓現金", detail:"郊區小店、巴士、神社香油錢等常僅收現金。", priority:""},
      {text:"確認信用卡海外刷卡與提款功能已開通", detail:"", priority:""},
      {text:"購買旅遊不便險／海外突發疾病險", detail:"", priority:""}
    ]
  },
  {
    title:"通訊與App", accent:"var(--gold)",
    items:[
      {text:"預訂網路分享機或 eSIM／實體 SIM 卡", detail:"", priority:"必辦"},
      {text:"下載 Google 地圖離線地圖（福岡・北九州・由布院一帶）", detail:"", priority:""},
      {text:"下載乘換案內類 App（Yahoo!乗換案内 或 Google Maps 皆可查日本電車巴士）", detail:"", priority:""},
      {text:"下載翻譯 App（Google 翻譯拍照翻譯功能）", detail:"", priority:""}
    ]
  },
  {
    title:"行李與穿著", accent:"var(--moss)",
    items:[
      {text:"查詢 11 月福岡・由布院當地氣溫，洋蔥式穿法", detail:"日夜溫差較大，早晚山區（皿倉山、由布院）會更涼，建議帶薄外套或針織衫。", priority:""},
      {text:"準備輕便雨具", detail:"", priority:""},
      {text:"帶一雙好走的鞋", detail:"太宰府、由布院、門司港皆需步行不少路。", priority:""},
      {text:"轉接插頭／充電器（日本為 A 型插座、110V）", detail:"", priority:""}
    ]
  }
];

const packing = [
  {
    title:"個人證件類", accent:"var(--vermilion)",
    items:["護照","信用卡","現金","網卡"]
  },
  {
    title:"衣物類", accent:"var(--steel)",
    items:["內衣／褲（5件）","上衣、背心（5件）","褲子、裙子（5件）","薄外套／襯衫（1件）","睡衣（1套）","襪子（5雙）","鞋子（1-2雙）","拖鞋（1雙）"]

  {

  },
  {
    title:"電子產品類", accent:"var(--moss)",
    items:["手機充電器、線","相機、電池（隨身行李）、相機充電器、記憶卡","耳機","插座轉換器","行動電源（隨身行李）、行動電源充電線","延長線"]
  },
  {
    title:"其他類", accent:"var(--steel)",
    items:["雨傘（最好託運比較保險）","手機掛繩","帽子","太陽眼鏡","口罩","酒精","衛生紙", "濕紙巾", "購物袋","壓縮袋","手提行李帶"],
    mustHave:["衛生紙","濕紙巾","購物袋"]
  },
  {
    title:"藥品類", accent:"var(--vermilion)",
    items:["常用藥品（感冒藥、止痛藥、暈機藥、腸胃藥、濕疹藥）","保健食品（益生菌、酵素、葉黃素、維他命）","維他命C","長期處方藥品","防蚊液"]
  },

const board = document.getElementById('board');
const panels = document.getElementById('panels');

// --- 行前準備 tab ---
const prepTab = document.createElement('div');
prepTab.className = 'tab prep-tab active';
prepTab.dataset.key = 'prep';
prepTab.innerHTML = `<div class="d-num">READY</div><div class="d-date">✓ 準備</div><div class="d-theme">行前須知</div>`;
prepTab.onclick = () => selectPanel('prep');
board.appendChild(prepTab);

const prepPanel = document.createElement('div');
prepPanel.className = 'panel active';
prepPanel.dataset.key = 'prep';
const prepGroupsHtml = prep.map(g => `
  <div class="prep-group" style="--accent:${g.accent}">
    <div class="prep-group-title"><span class="dot"></span>${g.title}</div>
    ${g.items.map(it => `
      <div class="prep-item" style="--accent:${g.accent}">
        <div class="prep-check"></div>
        <div class="prep-text">
          <div class="prep-main">${it.text}${it.priority ? `<span class="prep-priority">${it.priority}</span>` : ''}</div>
          ${it.detail ? `<div class="prep-detail">${it.detail}</div>` : ''}
        </div>
      </div>`).join('')}
  </div>`).join('');
prepPanel.innerHTML = `
  <h2 class="day-title">行前準備須知</h2>
  <span class="day-sub">出發前可以勾選確認・點項目即可打勾</span>
  ${prepGroupsHtml}`;
panels.appendChild(prepPanel);

panels.addEventListener('click', (e) => {
  const item = e.target.closest('.prep-item');
  if (item) { item.classList.toggle('checked'); return; }
});

// --- 行李清單 tab ---
const packTab = document.createElement('div');
packTab.className = 'tab prep-tab';
packTab.dataset.key = 'packing';
packTab.innerHTML = `<div class="d-num">PACK</div><div class="d-date">🧳 行李</div><div class="d-theme">出國清單</div>`;
packTab.onclick = () => selectPanel('packing');
board.appendChild(packTab);

const packPanel = document.createElement('div');
packPanel.className = 'panel';
packPanel.dataset.key = 'packing';
const packGroupsHtml = packing.map(g => `
  <div class="prep-group" style="--accent:${g.accent}">
    <div class="prep-group-title"><span class="dot"></span>${g.title}</div>
    <div class="prep-group-body${g.cols===3 ? ' cols-3' : ''}">
    ${g.items.map(txt => `
      <div class="prep-item" style="--accent:${g.accent}">
        <div class="prep-check"></div>
        <div class="prep-text">
          <div class="prep-main">${txt}${(g.mustHave && g.mustHave.includes(txt)) ? `<span class="prep-priority">必備</span>` : ''}</div>
        </div>
      </div>`).join('')}
    </div>
  </div>`).join('');
packPanel.innerHTML = `
  <h2 class="day-title">出國行李清單</h2>
  <span class="day-sub">打包時可逐項點選打勾</span>
  ${packGroupsHtml}`;
panels.appendChild(packPanel);

days.forEach((d, i) => {
  const tab = document.createElement('div');
  tab.className = 'tab';
  tab.dataset.key = String(i);
  tab.innerHTML = `<div class="d-num">DAY ${i+1}</div><div class="d-date">${d.date}</div><div class="d-theme">${d.wd}・${d.theme}</div>`;
  tab.onclick = () => selectPanel(String(i));
  board.appendChild(tab);

  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.dataset.key = String(i);

  function buildMealsHtml(meals, accent){
    if (!meals || !meals.length) {
      return `<div class="meal-section"><div class="meal-heading">餐廳</div><div class="meal-tbd">尚未決定 — 之後補上</div></div>`;
    }
    const cards = meals.map(m => `
      <div class="meal-card" style="--accent:${accent}">
        <div class="meal-card-head">
          <div class="meal-name">${m.name}${m.map ? mapA(m.map) : ''}</div>
          <div class="meal-type">${m.type}</div>
        </div>
        ${m.note ? `<div class="meal-note">${m.note}</div>` : ''}
      </div>`).join('');
    return `<div class="meal-section"><div class="meal-heading">餐廳建議・待確認</div>${cards}</div>`;
  }

  if (d.empty) {
    let stopsHtml = '';
    (d.stops || []).forEach(s => {
      stopsHtml += `
        <div class="stop" style="--accent:${d.accent}">
          ${s.tag ? `<span class="tag" style="--accent:${d.accent}">${s.tag}</span>` : ''}
          <div class="stop-time">${s.time}</div>
          <div class="stop-place">${s.place}${s.map ? mapA(s.map) : ''}</div>
          ${s.note ? `<div class="stop-note">${s.note}</div>` : ''}
        </div>`;
    });
    panel.innerHTML = `
      <h2 class="day-title">DAY ${i+1} · ${d.date}（${d.wd}）</h2>
      <span class="day-sub">${d.theme}</span>
      ${stopsHtml ? `<div class="timeline">${stopsHtml}</div>` : ''}
      ${d.note ? `<div class="note-box">${d.note}</div>` : ''}
      <div class="placeholder">
        <div class="big">尚未安排</div>
        <div>${d.placeholderText}</div>
      </div>
      ${buildMealsHtml(d.meals, d.accent)}`;
    panels.appendChild(panel);
    return;
  }

  let stopsHtml = '';
  d.stops.forEach(s => {
    stopsHtml += `
      <div class="stop" style="--accent:${d.accent}">
        ${s.tag ? `<span class="tag" style="--accent:${d.accent}">${s.tag}</span>` : ''}
        <div class="stop-time">${s.time}</div>
        <div class="stop-place">${s.place}${s.map ? mapA(s.map) : ''}</div>
        ${s.note ? `<div class="stop-note">${s.note}</div>` : ''}
      </div>`;
  });

  let plansHtml = '';
  d.plans.forEach((p, pi) => {
    const btns = p.options.map((o, oi) => `<button class="plan-btn ${oi===0?'on':''}" data-pi="${pi}" data-oi="${oi}">${o}</button>`).join('');
    const bodies = p.bodies.map((b, oi) => `<div class="plan-body ${oi===0?'on':''}" data-pi="${pi}" data-oi="${oi}">${b}</div>`).join('');
    plansHtml += `
      <div class="plan-block" style="--accent:${d.accent}">
        <div style="font-size:12px;color:var(--ink-soft);margin-bottom:8px;font-family:'JetBrains Mono',monospace;">${p.label}</div>
        <div class="plan-head">${btns}</div>
        ${bodies}
      </div>`;
  });

  panel.innerHTML = `
    <h2 class="day-title">DAY ${i+1} · ${d.date}（${d.wd}）</h2>
    <span class="day-sub">${d.theme}</span>
    <div class="timeline">${stopsHtml}</div>
    ${plansHtml}
    ${d.fare ? `<div class="fare">${d.fare}</div>` : ''}
    ${d.note ? `<div class="note-box">${d.note}</div>` : ''}
    ${buildMealsHtml(d.meals, d.accent)}
  `;
  panels.appendChild(panel);
});

function selectPanel(key){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.key === key));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.dataset.key === key));
}

panels.addEventListener('click', (e) => {
  const btn = e.target.closest('.plan-btn');
  if (!btn) return;
  const pi = btn.dataset.pi;
  const block = btn.closest('.plan-block');
  block.querySelectorAll(`.plan-btn[data-pi="${pi}"]`).forEach(b => b.classList.toggle('on', b === btn));
  block.querySelectorAll(`.plan-body[data-pi="${pi}"]`).forEach(b => b.classList.toggle('on', b.dataset.oi === btn.dataset.oi));
});
</script>
