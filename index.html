<style>
  :root{
    --bg:#F1ECE1;
    --panel:#FBF8F2;
    --ink:#1F2A3C;
    --ink-soft:#5B6474;
    --line:rgba(31,42,60,0.14);
    --vermilion:#C1440E;
    --moss:#5B7553;
    --gold:#B98A2E;
    --steel:#3E6285;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(circle at 10% 0%, rgba(62,98,133,0.06), transparent 40%),
      radial-gradient(circle at 90% 10%, rgba(193,68,14,0.05), transparent 35%);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    padding:28px 16px 60px;
    min-height:100vh;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:760px; margin:0 auto;}
  @media (max-width:400px){
    body{padding:18px 10px 50px;}
  }

  /* header */
  header{
    border-bottom:2px solid var(--ink);
    padding-bottom:18px;
    margin-bottom:22px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:12px;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.18em;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  h1{
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    font-size:clamp(28px,6vw,38px);
    margin:0;
    letter-spacing:0.02em;
  }
  .flight-badge{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    background:var(--ink);
    color:var(--bg);
    padding:8px 12px;
    border-radius:2px;
    text-align:right;
    line-height:1.6;
  }
  .flight-badge b{color:#F4C97B; font-weight:700;}

  /* day tabs — departure board style */
  .board{
    display:flex;
    gap:6px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    padding:6px 2px 10px;
    margin:0 -2px 24px;
    scrollbar-width:thin;
    position:sticky;
    top:0;
    z-index:10;
    background:var(--bg);
  }
  .board::-webkit-scrollbar{height:4px;}
  .tab{
    flex:0 0 auto;
    background:var(--panel);
    border:1px solid var(--line);
    border-bottom:3px solid transparent;
    border-radius:3px 3px 0 0;
    padding:12px 14px;
    cursor:pointer;
    min-width:96px;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    transition:all .18s ease;
  }
  .tab:hover{background:var(--white);}
  .tab.active{
    background:var(--ink);
    border-bottom:3px solid var(--vermilion);
  }
  .tab .d-num{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.1em;
    color:var(--ink-soft);
  }
  .tab.active .d-num{color:#B7C2D6;}
  .tab .d-date{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:15px;
    margin:2px 0 3px;
  }
  .tab.active .d-date{color:var(--bg);}
  .tab .d-theme{
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .tab.active .d-theme{color:#D7DCE5;}

  /* day panel */
  .panel{display:none;}
  .panel.active{display:block; animation:fade .35s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  .day-title{
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    font-size:22px;
    margin:0 0 2px;
  }
  .day-sub{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:20px;
    display:block;
  }

  /* timeline */
  .timeline{position:relative; padding-left:26px;}
  .timeline::before{
    content:"";
    position:absolute; left:6px; top:6px; bottom:6px;
    width:2px;
    background:repeating-linear-gradient(var(--line) 0 6px, transparent 6px 10px);
  }
  .stop{position:relative; margin-bottom:18px;}
  .stop::before{
    content:"";
    position:absolute; left:-26px; top:5px;
    width:10px; height:10px;
    border-radius:50%;
    background:var(--bg);
    border:2px solid var(--accent, var(--steel));
  }
  .stop-time{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:15px;
    color:var(--accent, var(--steel));
  }
  .stop-place{font-weight:700; font-size:15px; margin:2px 0 3px;}
  .stop-note{font-size:13px; color:var(--ink-soft); line-height:1.55;}
  .map-link{
    display:inline-flex;
    align-items:center;
    gap:3px;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    font-weight:700;
    color:var(--accent, var(--steel));
    text-decoration:none;
    border:1px solid currentColor;
    border-radius:10px;
    padding:4px 9px 4px 6px;
    margin-left:6px;
    vertical-align:middle;
    white-space:nowrap;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .map-link:hover{background:currentColor; color:var(--white) !important;}
  .map-link svg{width:9px; height:9px; flex:none;}
  .leg .p .map-link{margin-left:6px;}
  .tag{
    display:inline-block;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.06em;
    padding:2px 7px;
    border-radius:2px;
    color:var(--white);
    background:var(--accent, var(--steel));
    margin-right:6px;
    vertical-align:middle;
  }

  /* plan card */
  .plan-block{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:14px 16px;
    margin:10px 0 18px;
  }
  .plan-head{
    display:flex; gap:8px; margin-bottom:10px;
  }
  .plan-btn{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    font-weight:700;
    padding:8px 14px;
    border-radius:14px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink-soft);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .plan-btn.on{
    background:var(--ink);
    color:var(--bg);
    border-color:var(--ink);
  }
  .plan-body{display:none; font-size:13.5px; line-height:1.9;}
  .plan-body.on{display:block;}
  .leg{
    display:flex; justify-content:space-between; gap:10px;
    border-bottom:1px dashed var(--line);
    padding:4px 0;
  }
  .leg:last-child{border-bottom:none;}
  .leg .t{font-family:'JetBrains Mono', monospace; font-weight:700; white-space:nowrap;}
  .leg .p{color:var(--ink-soft); text-align:right;}

  .fare{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    background:#FBF3E4;
    border:1px dashed var(--gold);
    color:#7A5A17;
    padding:8px 12px;
    border-radius:4px;
    margin-top:8px;
  }
  .note-box{
    font-size:13px;
    color:var(--ink-soft);
    background:rgba(62,98,133,0.06);
    border-left:3px solid var(--steel);
    padding:8px 12px;
    border-radius:0 4px 4px 0;
    margin:10px 0;
  }

  /* meal recommendations */
  .meal-section{margin:22px 0 6px;}
  .meal-heading{
    display:flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .meal-heading::before{content:"";flex:0 0 14px; height:1px; background:var(--line);}
  .meal-heading::after{content:"";flex:1 1 auto; height:1px; background:var(--line);}
  .meal-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:3px solid var(--accent, var(--gold));
    border-radius:0 6px 6px 0;
    padding:12px 14px;
    margin-bottom:10px;
  }
  .meal-card-head{
    display:flex; justify-content:space-between; align-items:baseline; gap:8px;
    flex-wrap:wrap;
  }
  .meal-name{font-weight:700; font-size:14.5px;}
  .meal-type{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:var(--accent, var(--gold));
    letter-spacing:0.06em;
  }
  .meal-note{font-size:12.5px; color:var(--ink-soft); margin-top:4px; line-height:1.6;}
  .meal-tbd{
    font-size:12.5px;
    color:var(--ink-soft);
    font-style:italic;
    padding:10px 2px;
  }

  /* prep checklist */
  .tab.prep-tab{border-bottom-color:transparent;}
  .tab.prep-tab.active{border-bottom-color:var(--gold);}
  .prep-group{margin-bottom:22px;}
  .prep-group-title{
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    font-size:16px;
    margin-bottom:10px;
    display:flex; align-items:center; gap:8px;
  }
  .prep-group-title .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--accent, var(--gold));
    flex:none;
  }
  .prep-item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:12px 6px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .prep-group-body{
    display:grid;
    grid-template-columns:1fr 1fr;
    column-gap:18px;
  }
  .prep-group-body.cols-3{grid-template-columns:1fr 1fr 1fr;}
  .prep-group-body .prep-item:nth-last-child(1),
  .prep-group-body .prep-item:nth-last-child(2):nth-child(odd){
    border-bottom:none;
  }
  .prep-group-body.cols-3 .prep-item{border-bottom:1px solid var(--line);}
  @media (max-width:640px){
    .prep-group-body.cols-3{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:520px){
    .prep-group-body{grid-template-columns:1fr !important;}
    .prep-group-body .prep-item{border-bottom:1px solid var(--line);}
    .prep-group-body .prep-item:last-child{border-bottom:none;}
  }
  .prep-item:last-child{border-bottom:none;}
  .prep-check{
    flex:none;
    width:20px; height:20px;
    border:1.5px solid var(--ink-soft);
    border-radius:5px;
    margin-top:1px;
    position:relative;
    transition:all .15s ease;
  }
  .prep-item.checked .prep-check{
    background:var(--moss);
    border-color:var(--moss);
  }
  .prep-item.checked .prep-check::after{
    content:"";
    position:absolute; left:6px; top:2px;
    width:6px; height:11px;
    border:solid var(--white);
    border-width:0 2px 2px 0;
    transform:rotate(40deg);
  }
  .prep-text{flex:1;}
  .prep-item.checked .prep-main{
    color:var(--ink-soft);
    text-decoration:line-through;
    text-decoration-color:rgba(91,100,116,0.5);
  }
  .prep-main{font-size:14px; font-weight:500;}
  .prep-detail{font-size:12.5px; color:var(--ink-soft); margin-top:2px; line-height:1.55;}
  .prep-priority{
    font-family:'JetBrains Mono', monospace;
    font-size:9.5px;
    letter-spacing:0.06em;
    color:var(--vermilion);
    border:1px solid var(--vermilion);
    border-radius:3px;
    padding:1px 5px;
    margin-left:6px;
    white-space:nowrap;
  }

  /* hotel card */
  .hotel-card{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    background:var(--panel);
    border:1px solid var(--line);
    border-left:3px solid var(--moss);
    border-radius:0 6px 6px 0;
    padding:12px 16px;
    margin-bottom:22px;
  }
  .hotel-left{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .hotel-icon{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.08em;
    color:var(--moss);
    border:1px solid var(--moss);
    border-radius:3px;
    padding:2px 6px;
    flex:none;
  }
  .hotel-name{font-weight:700; font-size:14.5px;}
  .hotel-address{font-size:12px; color:var(--ink-soft);}
  .hotel-right{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    text-align:right;
    white-space:nowrap;
  }
  .hotel-right b{color:var(--ink);}

  /* weather tip */
  .weather-tip{
    display:flex; align-items:flex-start; gap:8px;
    background:rgba(62,98,133,0.06);
    border-left:3px solid var(--steel);
    border-radius:0 4px 4px 0;
    padding:8px 12px;
    font-size:12.5px;
    color:var(--ink-soft);
    margin:14px 0;
  }
  .weather-tip .w-icon{
    font-family:'JetBrains Mono', monospace;
    font-size:9.5px;
    letter-spacing:0.06em;
    color:var(--steel);
    border:1px solid var(--steel);
    border-radius:3px;
    padding:1px 5px;
    flex:none;
  }

  /* expense tracker */
  .expense-box{
    margin-top:24px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:14px 16px;
  }
  .expense-title{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.1em;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .expense-row{
    display:flex; justify-content:space-between; align-items:center;
    gap:8px;
    padding:6px 0;
    border-bottom:1px dashed var(--line);
    font-size:13.5px;
  }
  .expense-row .e-desc{flex:1;}
  .expense-row .e-amt{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    white-space:nowrap;
  }
  .expense-row .e-del{
    flex:none;
    width:22px; height:22px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink-soft);
    font-size:13px;
    cursor:pointer;
    line-height:1;
  }
  .expense-add{
    display:flex; gap:8px; margin-top:10px;
  }
  .expense-add input{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:13px;
    border:1px solid var(--line);
    border-radius:4px;
    padding:8px 10px;
    background:var(--white);
    color:var(--ink);
  }
  .expense-add .e-desc-input{flex:1; min-width:0;}
  .expense-add .e-amt-input{width:90px; font-family:'JetBrains Mono', monospace;}
  .expense-add button{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    font-weight:700;
    background:var(--ink);
    color:var(--bg);
    border:none;
    border-radius:4px;
    padding:0 14px;
    cursor:pointer;
    touch-action:manipulation;
  }
  .expense-sub{
    display:flex; justify-content:space-between;
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid var(--line);
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    font-weight:700;
  }
  .trip-total{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    text-align:right;
  }
  .trip-total b{color:var(--vermilion); font-size:14px;}

  /* app sections + bottom nav */
  body{padding-bottom:86px;}
  .section{display:none;}
  .section.active{display:block; animation:fade .3s ease;}
  .bottom-nav{
    position:fixed;
    left:0; right:0; bottom:0;
    display:flex;
    background:var(--panel);
    border-top:1px solid var(--line);
    z-index:50;
    padding-bottom:env(safe-area-inset-bottom, 0);
    box-shadow:0 -2px 10px rgba(31,42,60,0.06);
  }
  .nav-btn{
    flex:1;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:10px 0 8px;
    background:none; border:none;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:10.5px;
    color:var(--ink-soft);
    cursor:pointer;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    border-top:2px solid transparent;
  }
  .nav-btn .nav-icon{font-size:19px; line-height:1;}
  .nav-btn.active{color:var(--ink); border-top-color:var(--vermilion);}

  /* category buttons */
  .cat-row{display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 10px;}
  .cat-btn{
    font-size:12px;
    padding:6px 11px;
    border-radius:16px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink-soft);
    cursor:pointer;
    touch-action:manipulation;
  }
  .cat-btn.on{background:var(--ink); color:var(--bg); border-color:var(--ink);}

  /* people chips */
  .people-manage{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    margin-bottom:14px; padding-bottom:14px;
    border-bottom:1px solid var(--line);
  }
  .people-label{
    font-family:'JetBrains Mono', monospace;
    font-size:11px; letter-spacing:0.08em;
    color:var(--ink-soft); flex:none;
  }
  .person-chip{
    display:inline-flex; align-items:center; gap:5px;
    font-size:12.5px;
    padding:5px 6px 5px 12px;
    border-radius:16px;
    border:1px solid var(--line);
    background:var(--white);
  }
  .person-chip .p-del{
    width:16px; height:16px;
    border-radius:50%;
    background:var(--line);
    color:var(--ink-soft);
    font-size:11px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .person-add{display:flex; gap:6px;}
  .person-add input{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:12.5px;
    border:1px solid var(--line);
    border-radius:16px;
    padding:5px 12px;
    width:110px;
    background:var(--white);
    color:var(--ink);
  }
  .person-add button{
    font-size:12px; font-weight:700;
    border:1px solid var(--line);
    border-radius:50%;
    width:26px; height:26px;
    background:var(--white);
    color:var(--ink-soft);
    cursor:pointer;
  }
  .pick-chip{
    font-size:12px;
    padding:6px 12px;
    border-radius:16px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink-soft);
    cursor:pointer;
    touch-action:manipulation;
  }
  .pick-chip.on{background:var(--bg-accent, #E9F0F6); border-color:var(--steel); color:var(--steel); font-weight:700;}
  .field-label{font-size:11.5px; color:var(--ink-soft); margin:10px 0 5px;}
  .field-hint{font-size:11px; color:var(--ink-soft); margin-top:4px;}
  .e-cat{
    font-size:13px;
    margin-right:4px;
  }
  .e-payer{
    font-size:10.5px;
    color:var(--ink-soft);
    display:block;
    margin-top:1px;
  }

  /* settlement */
  .settle-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:14px 0;}
  .settle-card{
    background:var(--white);
    border-radius:6px;
    padding:10px 12px;
    border:1px solid var(--line);
  }
  .settle-name{font-size:12px; color:var(--ink-soft); margin-bottom:2px;}
  .settle-amt{font-family:'JetBrains Mono', monospace; font-weight:700; font-size:15px;}
  .settle-sub{font-size:10.5px; color:var(--ink-soft); margin-top:2px;}
  .settle-row{
    display:flex; align-items:center; gap:8px;
    background:#EAF3E9;
    border-radius:6px;
    padding:9px 12px;
    margin-bottom:8px;
    font-size:13px;
    color:#2E5A32;
  }
  .settle-row b{font-weight:700;}

  .reset-btn{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.04em;
    color:var(--vermilion);
    background:var(--white);
    border:1px solid var(--vermilion);
    border-radius:14px;
    padding:6px 13px;
    cursor:pointer;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
  }
  .reset-row{display:flex; justify-content:flex-end; margin-top:-6px; margin-bottom:14px;}
  .placeholder{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-soft);
    border:1.5px dashed var(--line);
    border-radius:8px;
  }
  .placeholder .big{
    font-family:'Noto Serif JP', serif;
    font-size:20px;
    color:var(--ink);
    margin-bottom:8px;
  }
  footer{
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:40px;
    letter-spacing:0.08em;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="eyebrow">KYUSHU · FUKUOKA ITINERARY</div>
      <h1>福岡・北九州</h1>
    </div>
    <div class="flight-badge">
      BR106&nbsp; TPE 08:00 → FUK 11:15<br>
      <b>11/6 (五) — 11/11 (三)</b> · 六天五夜
    </div>
  </header>

  <div class="hotel-card" id="hotel-card"></div>

  <div class="section" id="section-prep"></div>
  <div class="section" id="section-packing"></div>
  <div class="section" id="section-itinerary">
    <div class="board" id="board"></div>
    <div id="panels"></div>
  </div>
  <div class="section" id="section-expense"></div>

  <footer>行程可能隨天氣與現場狀況調整・出發前請再次確認車次時刻</footer>
</div>

<nav class="bottom-nav">
  <button class="nav-btn" data-section="prep" onclick="selectSection('prep')"><span class="nav-icon">✓</span><span>準備</span></button>

const CURRENCIES = [
  {key:'JPY', sign:'¥'},
  {key:'TWD', sign:'NT$'}
];
function currencySign(key){ return (CURRENCIES.find(c => c.key === key) || CURRENCIES[0]).sign; }
function fmtAmt(amt, currency){ return currencySign(currency) + Math.round(amt).toLocaleString(); }
function shareAmt(e){ return e.splitCount && e.splitCount > 1 ? e.amt / e.splitCount : e.amt; }
function sumByCurrency(list){
  const totals = {};
  list.forEach(e => { const cur = e.currency || 'JPY'; totals[cur] = (totals[cur] || 0) + shareAmt(e); });
  return totals;
}
function fmtTotals(totals){
  const parts = Object.keys(totals).map(cur => fmtAmt(totals[cur], cur));
  return parts.length ? parts.join('　／　') : '¥0';
}

const RATE_KEY = 'fukuoka_exchange_rate_v1';
function loadRate(){
  try {
    const raw = localStorage.getItem(RATE_KEY);
    return raw ? parseFloat(raw) : 0.198;
  } catch(e){ return 0.198; }
}
function saveRate(){
  try { localStorage.setItem(RATE_KEY, String(exchangeRate)); } catch(e){}
}
let exchangeRate = loadRate(); // 1 JPY = exchangeRate TWD
function convertAmt(amt, fromCur){
  if (fromCur === 'JPY') return amt * exchangeRate;
  if (fromCur === 'TWD') return amt / exchangeRate;
  return amt;
}
function otherCur(cur){ return cur === 'JPY' ? 'TWD' : 'JPY'; }
function fmtConverted(amt, fromCur){
  const to = otherCur(fromCur);
  return `≈ ${fmtAmt(convertAmt(amt, fromCur), to)}`;
}
function onRateChange(){
  const input = document.getElementById('exchange-rate-input');
  const v = parseFloat(input.value);
  if (!isNaN(v) && v > 0) { exchangeRate = v; saveRate(); renderExpenses(); }
}

// 統一以台幣為主要顯示，日幣括號在下面
function toTwdJpy(amt, fromCur){
  const twd = fromCur === 'TWD' ? amt : convertAmt(amt, 'JPY');
  const jpy = fromCur === 'JPY' ? amt : convertAmt(amt, 'TWD');
  return {twd, jpy};
}
function totalsToTwdJpy(totals){
  const twd = (totals.TWD || 0) + convertAmt(totals.JPY || 0, 'JPY');
  const jpy = (totals.JPY || 0) + convertAmt(totals.TWD || 0, 'TWD');
  return {twd, jpy};
}
function fmtRowAmt(amt, fromCur){
  const {twd, jpy} = toTwdJpy(amt, fromCur);
  return `NT$${Math.round(twd).toLocaleString()}<span class="e-payer" style="display:block;text-align:right;">（≈¥${Math.round(jpy).toLocaleString()}）</span>`;
}
function fmtTwdMain(totals){
  const {twd, jpy} = totalsToTwdJpy(totals);
  return `NT$${Math.round(twd).toLocaleString()}<span class="e-payer" style="display:block;text-align:right;">（≈¥${Math.round(jpy).toLocaleString()}）</span>`;
}
function fmtTwdOneLine(totals){
  const {twd, jpy} = totalsToTwdJpy(totals);
  return `NT$${Math.round(twd).toLocaleString()}（≈¥${Math.round(jpy).toLocaleString()}）`;
}

  box.style.display = 'block';

  try {

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'fukuoka-expenses-backup.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch(e){ /* download not supported, textarea copy still works */ }
}

function renderFixedExpenses(){
  const listEl = document.getElementById('fixed-expense-list');
  const subEl = document.getElementById('fixed-expense-total');
  if (!listEl) return {};
  listEl.innerHTML = fixedExpenses.map(e => {
    const c = catInfo(e.category);
    const pm = PAYMENT_METHODS.find(m => m.key === e.paymentMethod) || PAYMENT_METHODS[0];
    const dateLabel = e.date ? e.date.slice(5).replace('-', '/') : '';
    const hasSplit = e.splitCount && e.splitCount > 1;
    const totalTwdJpy = toTwdJpy(e.amt, e.currency);
    const totalNote = hasSplit
      ? `<span class="e-payer">${e.splitCount}人合計 NT$${Math.round(totalTwdJpy.twd).toLocaleString()}（≈¥${Math.round(totalTwdJpy.jpy).toLocaleString()}）</span>` : '';
    const displayAmt = hasSplit ? e.amt / e.splitCount : e.amt;
    return `
      <div class="expense-row">
        <span class="e-desc"><span class="e-cat">${c.emoji}</span>${e.note}<span class="e-payer">${dateLabel}・${pm.emoji} ${pm.label}・${c.label}</span>${totalNote}</span>
        <span class="e-amt">${fmtRowAmt(displayAmt, e.currency)}</span>
      </div>`;
  }).join('');
  const totals = sumByCurrency(fixedExpenses);
  subEl.innerHTML = fmtTwdMain(totals);
  return totals;
}

function renderExpenses(){
  const groupsEl = document.getElementById('expense-groups');
  const grandEl = document.getElementById('expense-grand-total');
  if (!groupsEl) return;

  const fixedTotals = renderFixedExpenses();

  const withIdx = expenseEntries.map((e, idx) => ({...e, idx}))
    .sort((a,b) => (b.date || '').localeCompare(a.date || ''));

  groupsEl.innerHTML = withIdx.length ? withIdx.map(e => {
    const c = catInfo(e.category);
    const pm = PAYMENT_METHODS.find(m => m.key === e.paymentMethod) || PAYMENT_METHODS[0];
    const title = e.note ? e.note : c.label;
    const dateLabel = e.date ? e.date.slice(5).replace('-', '/') : '無日期';
    return `
      <div class="expense-row">
        <span class="e-desc"><span class="e-cat">${c.emoji}</span>${title}<span class="e-payer">${dateLabel}・${pm.emoji} ${pm.label}・${c.label}</span></span>
        <span class="e-amt">${fmtRowAmt(e.amt, e.currency)}</span>
        <span class="e-del" onclick="deleteExpense(${e.idx})">×</span>
      </div>`;
  }).join('') : `<div class="meal-tbd">還沒有其他花費記錄</div>`;

  const dynamicTotals = sumByCurrency(expenseEntries);
  const grandTotals = {};
  Object.keys(fixedTotals).forEach(cur => { grandTotals[cur] = (grandTotals[cur] || 0) + fixedTotals[cur]; });
  Object.keys(dynamicTotals).forEach(cur => { grandTotals[cur] = (grandTotals[cur] || 0) + dynamicTotals[cur]; });
  const totalInTwd = (grandTotals.JPY ? convertAmt(grandTotals.JPY, 'JPY') : 0) + (grandTotals.TWD || 0);

  grandEl.innerHTML = fmtTwdMain(grandTotals);
  const convertedGrandEl = document.getElementById('expense-grand-converted');
  if (convertedGrandEl) convertedGrandEl.textContent = '';
  const headerTotal = document.getElementById('trip-total-amt');
  if (headerTotal) headerTotal.textContent = fmtTwdOneLine(grandTotals);

  // 摘要卡片
  const summaryTotalsEl = document.getElementById('summary-totals');
  const summaryConvertedEl = document.getElementById('summary-converted');
  if (summaryTotalsEl) summaryTotalsEl.innerHTML = fmtTwdMain(grandTotals);
  if (summaryConvertedEl) summaryConvertedEl.textContent = '';

  // 預算進度
  const progressEl = document.getElementById('budget-progress');
  if (progressEl) {
    if (budgetTwd > 0) {
      const pct = Math.min(100, Math.round((totalInTwd / budgetTwd) * 100));
      const remaining = budgetTwd - totalInTwd;
      const over = remaining < 0;
      progressEl.innerHTML = `
        <div style="background:var(--white);border:1px solid var(--line);border-radius:8px;height:10px;overflow:hidden;margin-bottom:6px;">
          <div style="width:${pct}%;height:100%;background:${over ? 'var(--vermilion)' : 'var(--moss)'};"></div>
        </div>
        <div style="font-size:12.5px;color:${over ? 'var(--vermilion)' : 'var(--ink-soft)'};">
          已花 NT$${Math.round(totalInTwd).toLocaleString()} ／ 預算 NT$${budgetTwd.toLocaleString()}・${over ? '超出' : '還剩'} NT$${Math.abs(Math.round(remaining)).toLocaleString()}
        </div>`;
    } else {
      progressEl.innerHTML = '';
    }
  }

  // 依分類小計
  const catBreakdownEl = document.getElementById('category-breakdown');
  if (catBreakdownEl) {
    const all = fixedExpenses.concat(expenseEntries);
    const byCategory = {};
    all.forEach(e => {
      if (!byCategory[e.category]) byCategory[e.category] = {};
      byCategory[e.category][e.currency] = (byCategory[e.category][e.currency] || 0) + shareAmt(e);
    });
    const rows = getCategories()
      .filter(c => byCategory[c.key])
      .map(c => `
        <div class="expense-row">
          <span class="e-desc">${c.emoji} ${c.label}</span>
          <span class="e-amt">${fmtTwdMain(byCategory[c.key])}</span>
        </div>`).join('');
    catBreakdownEl.innerHTML = rows || `<div class="meal-tbd">還沒有花費記錄</div>`;
  }
}

renderPickerRows();
renderExpenses();

function selectPanel(key){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.key === key));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.dataset.key === key));
}

function selectSection(sec){
  document.querySelectorAll('.section').forEach(s => s.classList.toggle('active', s.id === 'section-' + sec));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.section === sec));
}
selectSection('itinerary');

panels.addEventListener('click', (e) => {
  const btn = e.target.closest('.plan-btn');
  if (!btn) return;
  const pi = btn.dataset.pi;
  const block = btn.closest('.plan-block');
  block.querySelectorAll(`.plan-btn[data-pi="${pi}"]`).forEach(b => b.classList.toggle('on', b === btn));
  block.querySelectorAll(`.plan-body[data-pi="${pi}"]`).forEach(b => b.classList.toggle('on', b.dataset.oi === btn.dataset.oi));
});
</script>
