<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="福岡行程">
<meta name="theme-color" content="#1F2A3C">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light;
    --bg:#F1ECE1;
    --panel:#FBF8F2;
    --ink:#1F2A3C;
    --ink-soft:#5B6474;
    --line:rgba(31,42,60,0.14);
    --vermilion:#C1440E;
    --moss:#5B7553;
    --gold:#B98A2E;
    --steel:#3E6285;
    --white:#FFFFFF;
  }
  body, .tab, .panel, .prep-group, .plan-block, .meal-card, .hotel-card, .fare, .note-box, .expense-box, .weather-tip{
    transition: background-color .25s ease, color .25s ease, border-color .25s ease;
  }
  *{box-sizing:border-box;}
  input, select, textarea{
    font-size:16px !important;
  }
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(circle at 10% 0%, rgba(62,98,133,0.06), transparent 40%),
      radial-gradient(circle at 90% 10%, rgba(193,68,14,0.05), transparent 35%);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    padding:28px 16px 60px;
    min-height:100vh;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:760px; margin:0 auto;}
  @media (max-width:400px){
    body{padding:18px 10px 50px;}
  }

  /* header */
  header{
    border-bottom:2px solid var(--ink);
    padding-bottom:18px;
    margin-bottom:22px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:12px;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.18em;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  h1{
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    font-size:clamp(28px,6vw,38px);
    margin:0;
    letter-spacing:0.02em;
  }
  .flight-badge{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    background:var(--ink);
    color:var(--bg);
    padding:8px 12px;
    border-radius:2px;
    text-align:right;
    line-height:1.6;
  }
  .flight-badge b{color:#F4C97B; font-weight:700;}

  /* day tabs — departure board style */
  .board{
    display:flex;
    gap:6px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    padding:6px 2px 10px;
    margin:0 -2px 24px;
    scrollbar-width:thin;
    position:sticky;
    top:0;
    z-index:10;
    background:var(--bg);
  }
  .board::-webkit-scrollbar{height:4px;}
  .tab{
    flex:0 0 auto;
    background:var(--panel);
    border:1px solid var(--line);
    border-bottom:3px solid transparent;
    border-radius:3px 3px 0 0;
    padding:12px 14px;
    cursor:pointer;
    min-width:96px;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    transition:all .18s ease;
  }
  .tab:hover{background:var(--white);}
  .tab.active{
    background:var(--ink);
    border-bottom:3px solid var(--vermilion);
  }
  .tab .d-num{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.1em;
    color:var(--ink-soft);
  }
  .tab.active .d-num{color:#B7C2D6;}
  .tab .d-date{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:15px;
    margin:2px 0 3px;
  }
  .tab.active .d-date{color:var(--bg);}
  .today-badge{
    display:inline-block;
    font-family:'JetBrains Mono', monospace;
    font-size:8.5px;
    font-weight:700;
    letter-spacing:0.04em;
    background:var(--vermilion);
    color:var(--white);
    border-radius:3px;
    padding:1px 4px;
    margin-left:5px;
    vertical-align:middle;
  }
  .tab .d-theme{
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .tab.active .d-theme{color:#D7DCE5;}

  /* day panel */
  .panel{display:none;}
  .panel.active{display:block; animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;} to{opacity:1;}}

  .day-title{
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    font-size:22px;
    margin:0 0 2px;
  }
  .day-sub{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:20px;
    display:block;
  }

  /* timeline */
  .timeline{position:relative; padding-left:26px;}
  .timeline::before{
    content:"";
    position:absolute; left:6px; top:6px; bottom:6px;
    width:2px;
    background:repeating-linear-gradient(var(--line) 0 6px, transparent 6px 10px);
  }
  .stop{position:relative; margin-bottom:18px;}
  .stop::before{
    content:"";
    position:absolute; left:-26px; top:5px;
    width:10px; height:10px;
    border-radius:50%;
    background:var(--bg);
    border:2px solid var(--accent, var(--steel));
  }
  .stop-time{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:15px;
    color:var(--accent, var(--steel));
  }
  .stop-place{font-weight:700; font-size:15px; margin:2px 0 3px;}
  .stop-note{font-size:13px; color:var(--ink-soft); line-height:1.55;}
  .stop-maybe{opacity:0.72;}
  .stop-maybe::before{
    background:transparent;
    border-style:dashed;
  }
  .stop-maybe .stop-place{font-style:italic;}
  .map-link{
    display:inline-flex;
    align-items:center;
    gap:3px;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    font-weight:700;
    color:var(--accent, var(--steel));
    text-decoration:none;
    border:1px solid currentColor;
    border-radius:10px;
    padding:4px 9px 4px 6px;
    margin-left:6px;
    vertical-align:middle;
    white-space:nowrap;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .map-link:hover{background:currentColor; color:var(--white) !important;}
  .map-link svg{width:9px; height:9px; flex:none;}
  .leg .p .map-link{margin-left:6px;}
  .tag{
    display:inline-block;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.06em;
    padding:2px 7px;
    border-radius:2px;
    color:var(--white);
    background:var(--accent, var(--steel));
    margin-right:6px;
    vertical-align:middle;
  }

  /* plan card */
  .plan-block{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:14px 16px;
    margin:10px 0 18px;
  }
  .plan-head{
    display:flex; gap:8px; margin-bottom:10px;
  }
  .plan-btn{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    font-weight:700;
    padding:8px 14px;
    border-radius:14px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink-soft);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .plan-btn.on{
    background:var(--ink);
    color:var(--bg);
    border-color:var(--ink);
  }
  .plan-body{display:none; font-size:13.5px; line-height:1.9;}
  .plan-body.on{display:block;}
  .leg{
    display:flex; justify-content:space-between; gap:10px;
    border-bottom:1px dashed var(--line);
    padding:4px 0;
  }
  .leg:last-child{border-bottom:none;}
  .leg .t{font-family:'JetBrains Mono', monospace; font-weight:700; white-space:nowrap;}
  .leg .p{color:var(--ink-soft); text-align:right;}

  .fare{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    background:#FBF3E4;
    border:1px dashed var(--gold);
    color:#7A5A17;
    padding:8px 12px;
    border-radius:4px;
    margin-top:8px;
  }
  .note-box{
    font-size:13px;
    color:var(--ink-soft);
    background:rgba(62,98,133,0.06);
    border-left:3px solid var(--steel);
    padding:8px 12px;
    border-radius:0 4px 4px 0;
    margin:10px 0;
  }

  /* meal recommendations */
  .meal-section{margin:22px 0 6px;}
  .meal-heading{
    display:flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .meal-heading::before{content:"";flex:0 0 14px; height:1px; background:var(--line);}
  .meal-heading::after{content:"";flex:1 1 auto; height:1px; background:var(--line);}
  .meal-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:3px solid var(--accent, var(--gold));
    border-radius:0 6px 6px 0;
    padding:12px 14px;
    margin-bottom:10px;
  }
  .meal-card-head{
    display:flex; justify-content:space-between; align-items:baseline; gap:8px;
    flex-wrap:wrap;
  }
  .meal-name{font-weight:700; font-size:14.5px;}
  .meal-type{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:var(--accent, var(--gold));
    letter-spacing:0.06em;
  }
  .meal-note{font-size:12.5px; color:var(--ink-soft); margin-top:4px; line-height:1.6;}
  .meal-tbd{
    font-size:12.5px;
    color:var(--ink-soft);
    font-style:italic;
    padding:10px 2px;
  }

  /* prep checklist */
  .tab.prep-tab{border-bottom-color:transparent;}
  .tab.prep-tab.active{border-bottom-color:var(--gold);}
  .prep-group{margin-bottom:22px;}
  .prep-group-title{
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    font-size:16px;
    margin-bottom:10px;
    display:flex; align-items:center; gap:8px;
  }
  .prep-group-title .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--accent, var(--gold));
    flex:none;
  }
  .prep-item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:12px 6px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .prep-group-body{
    display:grid;
    grid-template-columns:1fr 1fr;
    column-gap:18px;
  }
  .prep-group-body.cols-3{grid-template-columns:1fr 1fr 1fr;}
  .prep-group-body .prep-item:nth-last-child(1),
  .prep-group-body .prep-item:nth-last-child(2):nth-child(odd){
    border-bottom:none;
  }
  .prep-group-body.cols-3 .prep-item{border-bottom:1px solid var(--line);}
  @media (max-width:640px){
    .prep-group-body.cols-3{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:520px){
    .prep-group-body{grid-template-columns:1fr !important;}
    .prep-group-body .prep-item{border-bottom:1px solid var(--line);}
    .prep-group-body .prep-item:last-child{border-bottom:none;}
  }
  .prep-item:last-child{border-bottom:none;}
  .prep-check{
    flex:none;
    width:20px; height:20px;
    border:1.5px solid var(--ink-soft);
    border-radius:5px;
    margin-top:1px;
    position:relative;
    transition:all .15s ease;
  }
  .prep-item.checked .prep-check{
    background:var(--moss);
    border-color:var(--moss);
  }
  .prep-item.checked .prep-check::after{
    content:"";
    position:absolute; left:6px; top:2px;
    width:6px; height:11px;
    border:solid var(--white);
    border-width:0 2px 2px 0;
    transform:rotate(40deg);
  }
  .prep-text{flex:1;}
  .prep-item.checked .prep-main{
    color:var(--ink-soft);
    text-decoration:line-through;
    text-decoration-color:rgba(91,100,116,0.5);
  }
  .prep-main{font-size:14px; font-weight:500;}
  .prep-detail{font-size:12.5px; color:var(--ink-soft); margin-top:2px; line-height:1.55;}
  .prep-priority{
    font-family:'JetBrains Mono', monospace;
    font-size:9.5px;
    letter-spacing:0.06em;
    color:var(--vermilion);
    border:1px solid var(--vermilion);
    border-radius:3px;
    padding:1px 5px;
    margin-left:6px;
    white-space:nowrap;
  }

  /* hotel card */
  .hotel-card{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    background:var(--panel);
    border:1px solid var(--line);
    border-left:3px solid var(--moss);
    border-radius:0 6px 6px 0;
    padding:12px 16px;
    margin-bottom:22px;
  }
  .hotel-left{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .hotel-icon{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.08em;
    color:var(--moss);
    border:1px solid var(--moss);
    border-radius:3px;
    padding:2px 6px;
    flex:none;
  }
  .hotel-name{font-weight:700; font-size:14.5px;}
  .hotel-address{font-size:12px; color:var(--ink-soft);}
  .hotel-right{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    text-align:right;
    white-space:nowrap;
  }
  .hotel-right b{color:var(--ink);}

  /* JMA */
  .jma{margin:14px 0 -6px;padding:8px 12px;border:1px solid var(--line,#e5dccb);border-radius:6px;font-size:12.5px;color:var(--ink);background:rgba(62,98,133,0.04)}
  .jma-line{line-height:1.6}
  .jma-up{display:block;font-size:11px;color:var(--ink-soft)}
  .jma-link{display:inline-block;margin-top:4px;font-size:11.5px;color:var(--steel)}
  html{touch-action:manipulation}
  /* 優惠券 */
  .cp-group{font-family:'Noto Serif JP',serif;font-size:14px;font-weight:700;margin:22px 0 8px;color:var(--ink)}
  .cp-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px}
  .cp-card.used{opacity:.5}
  .cp-card.used .cp-name{text-decoration:line-through}
  .cp-top{display:flex;align-items:center;gap:12px}
  .cp-logo{width:112px;height:48px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex:none}
  .cp-name{flex:1;font-weight:700;font-size:15px;line-height:1.35;min-width:0}
  .cp-off{font-size:14px;font-weight:700;color:var(--vermilion);line-height:1.5;margin:8px 0 2px}
  .cp-exp{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-soft);margin-top:6px}
  .cp-exp.soon{color:#b4541a;border-color:#b4541a}
  .cp-exp.gone{color:#fff;background:var(--vermilion);border-color:var(--vermilion)}
  .cp-warn{font-size:12.5px;color:#b4541a;margin-top:6px;line-height:1.5}
  .cp-img{display:block;width:100%;margin-top:10px;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
  .cp-hint{font-size:11.5px;color:var(--ink-soft);margin-top:4px}
  .cp-more{margin-top:8px}
  .cp-more summary{font-size:12.5px;color:var(--steel);cursor:pointer;list-style:none;padding:4px 0}
  .cp-more summary::-webkit-details-marker{display:none}
  .cp-more summary::before{content:'▸ '}
  .cp-more[open] summary::before{content:'▾ '}
  .cp-tip{font-size:12.5px;color:var(--ink-soft);line-height:1.6;padding:2px 0 4px}
  .cp-bottom{display:flex;align-items:center;gap:10px;margin-top:10px}
  .cp-open{flex:1;text-align:center;background:var(--steel);color:#fff !important;font-weight:700;font-size:14px;padding:10px 12px;border-radius:10px;text-decoration:none;-webkit-tap-highlight-color:transparent}
  .cp-open.none{background:var(--line);color:var(--ink-soft) !important}
  .cp-used{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink-soft);white-space:nowrap;cursor:pointer;padding:6px 2px}
  .cp-used input{width:20px;height:20px}
  /* weather tip */
  .weather-tip{
    display:flex; align-items:flex-start; gap:8px;
    background:rgba(62,98,133,0.06);
    border-left:3px solid var(--steel);
    border-radius:0 4px 4px 0;
    padding:8px 12px;
    font-size:12.5px;
    color:var(--ink-soft);
    margin:14px 0;
  }
  .weather-tip .w-icon{
    font-family:'JetBrains Mono', monospace;
    font-size:9.5px;
    letter-spacing:0.06em;
    color:var(--steel);
    border:1px solid var(--steel);
    border-radius:3px;
    padding:1px 5px;
    flex:none;
  }

  /* expense tracker */
  .expense-box{
    margin-top:24px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:14px 16px;
  }
  .expense-title{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.1em;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .expense-row{
    display:flex; justify-content:space-between; align-items:center;
    gap:8px;
    padding:6px 0;
    border-bottom:1px dashed var(--line);
    font-size:13.5px;
  }
  .expense-row .e-desc{flex:1;}
  .expense-row .e-amt{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    white-space:nowrap;
  }
  .expense-row .e-del{
    flex:none;
    width:22px; height:22px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink-soft);
    font-size:13px;
    cursor:pointer;
    line-height:1;
  }
  .expense-add{
    display:flex; gap:8px; margin-top:10px;
  }
  .expense-add input{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:13px;
    border:1px solid var(--line);
    border-radius:4px;
    padding:8px 10px;
    background:var(--white);
    color:var(--ink);
  }
  .expense-add .e-desc-input{flex:1; min-width:0;}
  .expense-add .e-amt-input{width:90px; font-family:'JetBrains Mono', monospace;}
  .expense-add button{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    font-weight:700;
    background:var(--ink);
    color:var(--bg);
    border:none;
    border-radius:4px;
    padding:0 14px;
    cursor:pointer;
    touch-action:manipulation;
  }
  .expense-sub{
    display:flex; justify-content:space-between;
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid var(--line);
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    font-weight:700;
  }
  .trip-total{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    text-align:right;
  }
  .trip-total b{color:var(--vermilion); font-size:14px;}

  /* app sections + bottom nav */
  body{padding-bottom:86px;}
  .section{display:none;}
  .section.active{display:block; animation:fade .3s ease;}
  .bottom-nav{
    position:fixed;
    left:0; right:0; bottom:0;
    display:flex;
    background:var(--panel);
    border-top:1px solid var(--line);
    z-index:50;
    padding-bottom:env(safe-area-inset-bottom, 0);
    box-shadow:0 -2px 10px rgba(31,42,60,0.06);
  }
  .nav-btn{
    flex:1;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:10px 0 8px;
    background:none; border:none;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:10.5px;
    color:var(--ink-soft);
    cursor:pointer;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    border-top:2px solid transparent;
  }
  .nav-btn .nav-icon{font-size:19px; line-height:1;}
  .nav-btn.active{color:var(--ink); border-top-color:var(--vermilion);}

  /* category buttons */
  .cat-row{display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 10px;}
  .cat-btn{
    font-size:12px;
    padding:6px 11px;
    border-radius:16px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink-soft);
    cursor:pointer;
    touch-action:manipulation;
  }
  .cat-btn.on{background:var(--ink); color:var(--bg); border-color:var(--ink);}

  /* people chips */
  .people-manage{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    margin-bottom:14px; padding-bottom:14px;
    border-bottom:1px solid var(--line);
  }
  .people-label{
    font-family:'JetBrains Mono', monospace;
    font-size:11px; letter-spacing:0.08em;
    color:var(--ink-soft); flex:none;
  }
  .person-chip{
    display:inline-flex; align-items:center; gap:5px;
    font-size:12.5px;
    padding:5px 6px 5px 12px;
    border-radius:16px;
    border:1px solid var(--line);
    background:var(--white);
  }
  .person-chip .p-del{
    width:16px; height:16px;
    border-radius:50%;
    background:var(--line);
    color:var(--ink-soft);
    font-size:11px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .person-add{display:flex; gap:6px;}
  .person-add input{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:12.5px;
    border:1px solid var(--line);
    border-radius:16px;
    padding:5px 12px;
    width:110px;
    background:var(--white);
    color:var(--ink);
  }
  .person-add button{
    font-size:12px; font-weight:700;
    border:1px solid var(--line);
    border-radius:50%;
    width:26px; height:26px;
    background:var(--white);
    color:var(--ink-soft);
    cursor:pointer;
  }
  .pick-chip{
    font-size:12px;
    padding:6px 12px;
    border-radius:16px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink-soft);
    cursor:pointer;
    touch-action:manipulation;
  }
  .pick-chip.on{background:var(--bg-accent, #E9F0F6); border-color:var(--steel); color:var(--steel); font-weight:700;}
  .field-label{font-size:11.5px; color:var(--ink-soft); margin:10px 0 5px;}
  .field-hint{font-size:11px; color:var(--ink-soft); margin-top:4px;}
  .e-cat{
    font-size:13px;
    margin-right:4px;
  }
  .e-payer{
    font-size:10.5px;
    color:var(--ink-soft);
    display:block;
    margin-top:1px;
  }

  /* settlement */
  .settle-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:14px 0;}
  .settle-card{
    background:var(--white);
    border-radius:6px;
    padding:10px 12px;
    border:1px solid var(--line);
  }
  .settle-name{font-size:12px; color:var(--ink-soft); margin-bottom:2px;}
  .settle-amt{font-family:'JetBrains Mono', monospace; font-weight:700; font-size:15px;}
  .settle-sub{font-size:10.5px; color:var(--ink-soft); margin-top:2px;}
  .settle-row{
    display:flex; align-items:center; gap:8px;
    background:#EAF3E9;
    border-radius:6px;
    padding:9px 12px;
    margin-bottom:8px;
    font-size:13px;
    color:#2E5A32;
  }
  .settle-row b{font-weight:700;}

  .reset-btn{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.04em;
    color:var(--vermilion);
    background:var(--white);
    border:1px solid var(--vermilion);
    border-radius:14px;
    padding:6px 13px;
    cursor:pointer;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
  }
  .reset-row{display:flex; justify-content:flex-end; margin-top:-6px; margin-bottom:14px;}
  .placeholder{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-soft);
    border:1.5px dashed var(--line);
    border-radius:8px;
  }
  .placeholder .big{
    font-family:'Noto Serif JP', serif;
    font-size:20px;
    color:var(--ink);
    margin-bottom:8px;
  }
  footer{

<script>
/* JMA-START 氣象廳預報（要移除時：刪掉這段 script、CSS 的 .jma 區塊、以及 jmaBlock / jmaUpdate 兩個呼叫） */
var JMA_F={pref:'400000',area:'400010',pt:'82182',link:'400010',name:'福岡'};
var JMA_K={pref:'400000',area:'400020',pt:'82136',link:'400020',name:'北九州'};
var JMA_O={pref:'440000',area:'440010',pt:'',link:'440010',name:'大分（由布院）'};
var JMA_REGION={'11/6':JMA_F,'11/7':JMA_F,'11/8':JMA_K,'11/9':JMA_O,'11/10':JMA_F,'11/11':JMA_F};
var JMA_YEAR=2026, JMA_CACHE='fukuoka_jma_v1';
var JMA_TXT={100:'晴',101:'晴時多雲',102:'晴有短暫雨',103:'晴有時雨',110:'晴後多雲',111:'晴後多雲',112:'晴後有雨',113:'晴後有雨',114:'晴後雨',200:'多雲',201:'多雲時晴',202:'多雲有短暫雨',203:'多雲有時雨',210:'多雲後晴',211:'多雲後晴',212:'多雲後有雨',213:'多雲後有雨',214:'多雲後雨',300:'雨',301:'雨時晴',302:'雨時停',311:'雨後晴',313:'雨後多雲'};
function jmaWx(c){c=String(c||'');var d=c.charAt(0);var ic={'1':'☀️','2':'☁️','3':'🌧️','4':'🌨️'}[d]||'🌤️';var t=JMA_TXT[+c]||({'1':'晴','2':'多雲','3':'雨','4':'雪'}[d]||'');return {ic:ic,t:t};}
function jmaDateKey(md){var p=md.split('/');return JMA_YEAR+'-'+('0'+p[0]).slice(-2)+'-'+('0'+p[1]).slice(-2);}
function jmaLink(r){return 'https://data.jma.go.jp/multi/yoho/yoho_detail.html?code='+r.link+'&lang=cn_zt';}
function jmaParse(data,r){
  var out={};function row(k){return out[k]||(out[k]={});}
  try{
    var sh=data[0].timeSeries, wk=data[1]&&data[1].timeSeries;
    var a0=sh[0].areas.filter(function(a){return a.area.code===r.area;})[0]||sh[0].areas[0];
    sh[0].timeDefines.forEach(function(t,i){row(t.slice(0,10)).code=a0.weatherCodes[i];});
    if(sh[1]){var a1=sh[1].areas.filter(function(a){return a.area.code===r.area;})[0]||sh[1].areas[0];
      sh[1].timeDefines.forEach(function(t,i){var v=parseInt(a1.pops[i],10);if(isNaN(v))return;var o=row(t.slice(0,10));o.pop=Math.max(o.pop==null?-1:o.pop,v);});}
    if(sh[2]){var a2=sh[2].areas.filter(function(a){return a.area.code===r.pt;})[0]||sh[2].areas[0];
      var tmp={};sh[2].timeDefines.forEach(function(t,i){var v=parseFloat(a2.temps[i]);if(isNaN(v))return;(tmp[t.slice(0,10)]=tmp[t.slice(0,10)]||[]).push(v);});
      Object.keys(tmp).forEach(function(k){var o=row(k);o.smax=Math.max.apply(null,tmp[k]);o.smin=Math.min.apply(null,tmp[k]);});}
    if(wk){
      var w0=wk[0].areas.filter(function(a){return a.area.code===r.pref;})[0]||wk[0].areas[0];
      wk[0].timeDefines.forEach(function(t,i){var o=row(t.slice(0,10));if(!o.code&&w0.weatherCodes[i])o.code=w0.weatherCodes[i];
        var v=parseInt(w0.pops[i],10);if(o.pop==null&&!isNaN(v))o.pop=v;});
      if(wk[1]){var w1=wk[1].areas.filter(function(a){return a.area.code===r.pt;})[0]||wk[1].areas[0];
        wk[1].timeDefines.forEach(function(t,i){var o=row(t.slice(0,10));var mx=parseFloat(w1.tempsMax[i]),mn=parseFloat(w1.tempsMin[i]);
          if(!isNaN(mx))o.tmax=mx;if(!isNaN(mn))o.tmin=mn;});}
    }
    Object.keys(out).forEach(function(k){var o=out[k];if(o.tmax==null&&o.smax!=null)o.tmax=o.smax;if(o.tmin==null&&o.smin!=null)o.tmin=o.smin;});
  }catch(e){return {};}
  return out;
}
function jmaBlock(md){var r=JMA_REGION[md];if(!r)return '';
  return '<div class="jma" data-md="'+md+'"><div class="jma-line">氣象廳預報載入中…</div><a class="jma-link" href="'+jmaLink(r)+'" target="_blank" rel="noopener">氣象廳預報（繁中）</a></div>';}
function jmaFill(store){
  document.querySelectorAll('.jma[data-md]').forEach(function(el){
    var md=el.getAttribute('data-md'),r=JMA_REGION[md];if(!r)return;
    var rec=store&&store[r.pref]&&store[r.pref].data?jmaParse(store[r.pref].data,r)[jmaDateKey(md)]:null;
    var line=el.querySelector('.jma-line');
    if(rec&&rec.code){var w=jmaWx(rec.code);var bits=[w.ic+' '+w.t];
      if(rec.tmax!=null||rec.tmin!=null)bits.push((rec.tmax!=null?'最高 '+rec.tmax+'°':'')+(rec.tmin!=null?(rec.tmax!=null?'　':'')+'最低 '+rec.tmin+'°':''));
      if(rec.pop!=null)bits.push('降雨 '+rec.pop+'%');
      var ts=store[r.pref].t,d=new Date(ts);
      line.innerHTML=r.name+'・'+bits.join('　')+'<span class="jma-up">更新於 '+(d.getMonth()+1)+'/'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+'</span>';
    }else if(store&&store[r.pref]&&store[r.pref].data){line.innerHTML=r.name+'・這天還不在預報範圍內（氣象廳約提供 7 天內預報），之後會自動出現';}
    else line.textContent='目前抓不到氣象廳預報，請點下面的連結查看';
  });
}
function jmaUpdate(){
  var store={};try{store=JSON.parse(localStorage.getItem(JMA_CACHE)||'{}');}catch(e){}
  jmaFill(store);
  if(!window.fetch)return;
  var prefs={};Object.keys(JMA_REGION).forEach(function(k){prefs[JMA_REGION[k].pref]=1;});
  Object.keys(prefs).forEach(function(p){
    var ctl=window.AbortController?new AbortController():null;var tm=setTimeout(function(){if(ctl)ctl.abort();},10000);
    fetch('https://www.jma.go.jp/bosai/forecast/data/forecast/'+p+'.json',ctl?{signal:ctl.signal,cache:'no-store'}:{cache:'no-store'})
      .then(function(r){if(!r.ok)throw 0;return r.json();})
      .then(function(j){clearTimeout(tm);store[p]={t:Date.now(),data:j};try{localStorage.setItem(JMA_CACHE,JSON.stringify(store));}catch(e){}jmaFill(store);})
      .catch(function(){clearTimeout(tm);});
  });
}
/* JMA-END */
</script>

function askConfirm(msg){
  return new Promise(res => {
    let o = document.getElementById('ask-confirm');
    if (o) o.remove();
    o = document.createElement('div');
    o.id = 'ask-confirm';
    o.style.cssText = 'position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:24px;';
    o.innerHTML = '<div style="background:var(--bg);color:var(--ink);border-radius:14px;padding:20px;max-width:340px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.25);"><div id="ask-confirm-msg" style="font-size:15px;line-height:1.6;margin-bottom:18px;"></div><div style="display:flex;gap:10px;"><button id="ask-no" style="flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:15px;font-family:inherit;">取消</button><button id="ask-yes" style="flex:1;padding:11px;border-radius:10px;border:none;background:var(--vermilion);color:#fff;font-size:15px;font-family:inherit;">確定</button></div></div>';
    document.body.appendChild(o);
    o.querySelector('#ask-confirm-msg').textContent = msg;
    const done = v => { o.remove(); res(v); };
    o.querySelector('#ask-yes').onclick = () => done(true);
    o.querySelector('#ask-no').onclick = () => done(false);
    o.onclick = e => { if (e.target === o) done(false); };
  });
}
function showToast(msg){
  let toast = document.getElementById('app-toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'app-toast';
    toast.style.cssText = 'position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);font-family:"Zen Kaku Gothic New",sans-serif;font-size:13px;padding:9px 18px;border-radius:20px;z-index:100;opacity:0;transition:opacity .25s ease, transform .25s ease;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,0.2);';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  requestAnimationFrame(() => {
    toast.style.opacity = '1';
    toast.style.transform = 'translateX(-50%) translateY(0)';
  });
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(-50%) translateY(10px)';
  }, 1800);
}

}

function fmtNative(totals){
  const parts = [];
  if (totals.JPY) parts.push(`¥${Math.round(totals.JPY).toLocaleString()}`);
  if (totals.TWD) parts.push(`NT$${Math.round(totals.TWD).toLocaleString()}`);
  return parts.length ? parts.join('<br>') : '—';
}
function fmtTwdMain(totals, noConvert){
  const {twd, jpy} = totalsToTwdJpy(totals);
  if (noConvert) return `NT$${Math.round(twd).toLocaleString()}`;
  return `NT$${Math.round(twd).toLocaleString()}<span class="e-payer" style="display:block;text-align:right;">（≈¥${Math.round(jpy).toLocaleString()}）</span>`;
}
function fmtTwdOneLine(totals){
  const {twd} = totalsToTwdJpy(totals);
  return `約 NT$${Math.round(twd).toLocaleString()}`;
}

async function importExpenses(){
  const text = document.getElementById('import-textarea').value.trim();
  if (!text) return;
  let parsed;
  try { parsed = JSON.parse(text); }
  catch(e) { alert('格式不對，請確認貼上的是完整的備份文字'); return; }
  const list = Array.isArray(parsed) ? parsed : parsed.expenseEntries;
  if (!Array.isArray(list)) { alert('格式不對，請確認貼上的是完整的備份文字'); return; }
  const extras = [];
  if (!Array.isArray(parsed) && parsed.exchangeRate) extras.push(`匯率 ¥1=NT$${parsed.exchangeRate}`);
  if (!Array.isArray(parsed) && parsed.budgetTwd) extras.push(`預算 NT$${parsed.budgetTwd}`);
  if (!Array.isArray(parsed) && Array.isArray(parsed.customCategories) && parsed.customCategories.length) extras.push(`${parsed.customCategories.length} 個自訂分類`);
  const extraMsg = extras.length ? `，並還原 ${extras.join('、')}` : '';
  if (!(await askConfirm(`確定要加入 ${list.length} 筆記錄嗎${extraMsg}？`))) return;
  expenseEntries = expenseEntries.concat(list);
  saveExpenses();
  if (!Array.isArray(parsed)) {
    if (typeof parsed.exchangeRate === 'number' && parsed.exchangeRate > 0) {
      exchangeRate = parsed.exchangeRate;
      saveRate();
      const rateInput = document.getElementById('exchange-rate-input');
      if (rateInput) rateInput.value = exchangeRate;
    }
    if (typeof parsed.budgetTwd === 'number' && parsed.budgetTwd > 0) {
      budgetTwd = parsed.budgetTwd;
      saveBudget();
      const budgetInput = document.getElementById('budget-input');
      if (budgetInput) budgetInput.value = budgetTwd;
    }
    if (Array.isArray(parsed.customCategories) && parsed.customCategories.length) {
      parsed.customCategories.forEach(c => {
        if (c && c.key && !customCategories.some(existing => existing.key === c.key)) customCategories.push(c);
      });
      saveCustomCategories();
      renderPickerRows();
    }
  }
  document.getElementById('import-textarea').value = '';
  document.getElementById('import-box').style.display = 'none';
  renderExpenses();
  showToast('匯入完成 ✓');
}

      <div class="e-title"><span class="e-cat">${c.emoji}</span>${title}</div>
      <div class="e-meta">${dateLabel}・${pm.emoji} ${pm.label}・${c.label}${twdActualTag(e)}</div>

function renderCurrencyGroups(){
  const el = document.getElementById('exp-currency-groups');
  if (!el) return;
  const all = fixedExpenses.map(e => ({e, fixed:true, idx:-1}))
    .concat(expenseEntries.map((e, idx) => ({e, fixed:false, idx})));
  const defs = [{cur:'JPY', title:'日幣花費', sub:'日幣小計'}, {cur:'TWD', title:'台幣花費', sub:'台幣小計'}];
  el.innerHTML = defs.map(d => {
    const items = all.filter(o => o.e.currency === d.cur)
      .sort((a,b) => (a.e.date || '9999').localeCompare(b.e.date || '9999'));
    if (!items.length) return '';
    const total = items.reduce((sum,o) => sum + shareAmt(o.e), 0);
    const approx = d.cur === 'JPY' ? `<span class="e-payer" style="display:block;text-align:right;">≈ NT$${Math.round(total * exchangeRate + twdAdj(items.map(o => o.e))).toLocaleString()}</span>` : '';
    return `
      <div class="exp-group-title">${d.title}</div>
      ${items.map(o => expRowHtml(o.e, o.fixed, o.idx)).join('')}
      <div class="expense-sub"><span>${d.sub}</span><span style="text-align:right;">${fmtRowAmt(total, d.cur)}${approx}</span></div>`;
  }).join('');
}
function renderExpenses(){
  const groupsEl = document.getElementById('expense-groups');
  const grandEl = document.getElementById('expense-grand-total');
  if (!groupsEl) return;

  const fixedTotals = renderFixedExpenses();
  renderCurrencyGroups();

  const withIdx = expenseEntries.map((e, idx) => ({...e, idx}))
    .sort((a,b) => (b.date || '').localeCompare(a.date || ''));

  groupsEl.innerHTML = withIdx.length ? withIdx.map(e => {
    const c = catInfo(e.category);
    const pm = PAYMENT_METHODS.find(m => m.key === e.paymentMethod) || PAYMENT_METHODS[0];
    const title = e.note ? e.note : c.label;
    const dateLabel = e.date ? e.date.slice(5).replace('-', '/') : '無日期';
    return `
      <div class="expense-row">
        <span class="e-desc"><span class="e-cat">${c.emoji}</span>${title}<span class="e-payer">${dateLabel}・${pm.emoji} ${pm.label}・${c.label}${twdActualTag(e)}</span></span>
        <span class="e-amt">${fmtRowAmt(e.amt, e.currency)}</span>
        <span class="e-del" style="background:var(--white);color:var(--steel);border:1px solid var(--line);margin-right:4px;" onclick="editExpense(${e.idx})">✎</span>
        <span class="e-del" onclick="deleteExpense(${e.idx})">×</span>
      </div>`;
  }).join('') : '';

  const dynamicTotals = sumByCurrency(expenseEntries);
  const grandTotals = {};
  Object.keys(fixedTotals).forEach(cur => { grandTotals[cur] = (grandTotals[cur] || 0) + fixedTotals[cur]; });
  Object.keys(dynamicTotals).forEach(cur => { grandTotals[cur] = (grandTotals[cur] || 0) + dynamicTotals[cur]; });
  const grandAdj = twdAdj(fixedExpenses) + twdAdj(expenseEntries);
  const totalInTwd = (grandTotals.JPY ? convertAmt(grandTotals.JPY, 'JPY') : 0) + (grandTotals.TWD || 0) + grandAdj;

  grandEl.innerHTML = '';
  const convertedGrandEl = document.getElementById('expense-grand-converted');
  if (convertedGrandEl) convertedGrandEl.textContent = '';
  const headerTotal = document.getElementById('trip-total-amt');
  if (headerTotal) headerTotal.textContent = `約 NT$${Math.round(totalInTwd).toLocaleString()}`;

  // 摘要卡片
  const summaryTotalsEl = document.getElementById('summary-totals');
  const summaryConvertedEl = document.getElementById('summary-converted');
  if (summaryTotalsEl) summaryTotalsEl.textContent = `約 NT$${Math.round(totalInTwd).toLocaleString()}`;
  if (summaryConvertedEl) summaryConvertedEl.innerHTML = grandTotals.JPY ? `日幣依 ¥1 = NT$${exchangeRate} 換算${grandAdj ? '（有填實刷台幣的項目用實刷金額）' : ''}　<span style="text-decoration:underline;cursor:pointer;color:var(--steel);" onclick="openRateFold()">修改匯率</span>` : '';
  const subEl2 = document.getElementById('exp-subtotals');
  if (subEl2){
    const rows = [];
    if (grandTotals.JPY) rows.push(`<div class="expense-sub"><span>日幣小計</span><span>¥${Math.round(grandTotals.JPY).toLocaleString()}</span></div>`);
    if (grandTotals.TWD) rows.push(`<div class="expense-sub"><span>台幣小計</span><span>NT$${Math.round(grandTotals.TWD).toLocaleString()}</span></div>`);
    subEl2.innerHTML = rows.join('');
  }

  // 預算進度
  const progressEl = document.getElementById('budget-progress');
  if (progressEl) {
    if (budgetTwd > 0) {
      const pct = Math.min(100, Math.round((totalInTwd / budgetTwd) * 100));
      const remaining = budgetTwd - totalInTwd;
      const over = remaining < 0;
      progressEl.innerHTML = `
        <div style="background:var(--white);border:1px solid var(--line);border-radius:8px;height:10px;overflow:hidden;margin-bottom:6px;">
          <div style="width:${pct}%;height:100%;background:${over ? 'var(--vermilion)' : 'var(--moss)'};"></div>
        </div>
        <div style="font-size:12.5px;color:${over ? 'var(--vermilion)' : 'var(--ink-soft)'};">
          已花 NT$${Math.round(totalInTwd).toLocaleString()} ／ 預算 NT$${budgetTwd.toLocaleString()}・${over ? '超出' : '還剩'} NT$${Math.abs(Math.round(remaining)).toLocaleString()}
        </div>`;
    } else {
      progressEl.innerHTML = '';
    }
  }

  // 依分類小計
  const catBreakdownEl = document.getElementById('category-breakdown');
  if (catBreakdownEl) {
    const all = fixedExpenses.concat(expenseEntries);
    const byCategory = {};
    const catNoConvert = {};
    all.forEach(e => {
      if (!byCategory[e.category]) byCategory[e.category] = {};
      byCategory[e.category][e.currency] = (byCategory[e.category][e.currency] || 0) + shareAmt(e);
      if (e.noConvert) catNoConvert[e.category] = true;
    });
    const rows = getCategories()
      .filter(c => byCategory[c.key])
      .map(c => `
        <div class="expense-row">
          <span class="e-desc">${c.emoji} ${c.label}</span>
          <span class="e-amt">${fmtNative(byCategory[c.key])}</span>
        </div>`).join('');
    catBreakdownEl.innerHTML = rows || `<div class="meal-tbd">還沒有花費記錄</div>`;
  }

  // 依付款方式小計
  const payBreakdownEl = document.getElementById('payment-breakdown');
  if (payBreakdownEl) {
    const all = fixedExpenses.concat(expenseEntries);
    const byPayment = {};
    all.forEach(e => {
      const key = e.paymentMethod || 'cash';
      if (!byPayment[key]) byPayment[key] = {};
      byPayment[key][e.currency] = (byPayment[key][e.currency] || 0) + shareAmt(e);
    });
    const rows = PAYMENT_METHODS
      .filter(m => byPayment[m.key])
      .map(m => `
        <div class="expense-row">
          <span class="e-desc">${m.emoji} ${m.label}</span>
          <span class="e-amt">${fmtNative(byPayment[m.key])}</span>
        </div>`).join('');
    payBreakdownEl.innerHTML = rows || `<div class="meal-tbd">還沒有花費記錄</div>`;
    const wrap = document.getElementById('pay-breakdown-wrap');
    if (wrap) wrap.style.display = Object.keys(byPayment).length > 1 ? '' : 'none';
  }
}

function openPhotoDB(){
  return new Promise(res => {
    try {
      const rq = indexedDB.open('fukuoka_photos', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('p');
      rq.onsuccess = () => { photoDB = rq.result; res(true); };
      rq.onerror = () => res(false);
    } catch(e){ res(false); }
  });
}
function idbPut(id, data){
  return new Promise(res => {
    if (!photoDB) return res(false);
    try {
      const tx = photoDB.transaction('p','readwrite');
      tx.objectStore('p').put(data, id);
      tx.oncomplete = () => res(true);
      tx.onerror = tx.onabort = () => res(false);
    } catch(e){ res(false); }
  });
}
function idbDel(id){ try { if (photoDB) photoDB.transaction('p','readwrite').objectStore('p').delete(id); } catch(e){} }
function idbLoadAll(){
  return new Promise(res => {
    if (!photoDB) return res();
    try {
      const rq = photoDB.transaction('p').objectStore('p').openCursor();
      rq.onsuccess = () => { const c = rq.result; if (c){ photoCache[c.key] = c.value; c.continue(); } else res(); };
      rq.onerror = () => res();
    } catch(e){ res(); }
  });
}
function photoSrc(it){ return it.photoId ? (photoCache[it.photoId] || '') : (it.photo || ''); }
function dropPhoto(it){ if (it.photoId){ idbDel(it.photoId); delete photoCache[it.photoId]; } delete it.photoId; delete it.photo; }
function entrySrc(e){ return e.id ? (photoCache[e.id] || '') : (e.d || ''); }
function receiptList(it){ return (it.receipts || []).map(e => ({e, src: entrySrc(e)})).filter(x => x.src); }
function receiptSrc(it){ return receiptList(it).length ? 'y' : ''; }
function dropEntry(e){ if (e.id){ idbDel(e.id); delete photoCache[e.id]; } }
function dropReceipt(it){ (it.receipts || []).forEach(dropEntry); delete it.receipts; }
function dropAllPhotos(it){ dropPhoto(it); dropReceipt(it); }
async function storeEntry(dataUrl){ const r = await storePhoto(dataUrl); return r.photoId ? {id: r.photoId} : {d: r.photo}; }
function migrateReceipts(it){
  if (it.receiptId){ it.receipts = (it.receipts || []).concat([{id: it.receiptId}]); delete it.receiptId; }
  if (it.receipt){ it.receipts = (it.receipts || []).concat([{d: it.receipt}]); delete it.receipt; }
}
function readPhoto(file){
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1280, r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}

  return {photo:dataUrl};
}

  t.firstChild.textContent = msg;
  let finished = false;
  const finish = () => { if (finished) return; finished = true; t.remove(); };
  t._expire = () => { if (!finished){ finished = true; onExpire && onExpire(); } };
  t.querySelector('button').onclick = () => { if (finished) return; finished = true; clearTimeout(t._t); t.remove(); onUndo && onUndo(); };

  document.body.appendChild(t);
}

function shopListText(){
  const items = shopItems.filter(it => (it.type || 'me') === shopTab);
  const line = it => {
    const q = Number(it.qty) || 1;
    let t = `${it.done ? '☑' : '☐'} ${itemTitle(it)}${q > 1 ? ' ×' + q : ''}`;
    const extra = [];
    if (it.store) extra.push(it.store);
    if (itemTotal(it) > 0) extra.push(fmtYen(itemTotal(it)));
    if (it.note) extra.push(it.note);
    if (extra.length) t += `（${extra.join('・')}）`;
    return t;
  };
  if (shopTab === 'me') return `【福岡購物清單｜自己要買】\n` + sortUndoneFirst(items).map(line).join('\n');
  const groups = {};
  items.forEach(it => { const w = it.who || '未指定'; (groups[w] = groups[w] || []).push(it); });
  return `【福岡購物清單｜幫別人買】\n` + Object.keys(groups).map(w => `\n▍${w}\n` + sortUndoneFirst(groups[w]).map(line).join('\n')).join('\n');

// 旅行期間：自動跳到今天，標出目前最接近的一站
function highlightToday(scroll){
  const now = new Date();
  const key = (now.getMonth() + 1) + '/' + now.getDate();
  const idx = days.findIndex(d => d.date === key);
  if (idx < 0) return;
  if (String(idx) !== currentDayKey) selectPanel(String(idx));
  const panel = document.querySelector('.panel[data-key="' + idx + '"]');
  if (!panel) return;
  document.querySelectorAll('.stop-now').forEach(e => e.classList.remove('stop-now'));
  const mins = now.getHours() * 60 + now.getMinutes();
  let pick = null, first = null;
  panel.querySelectorAll('.stop').forEach(st => {
    const t = st.querySelector('.stop-time');
    const m = t && t.textContent.match(/(\d{1,2}):(\d{2})/);
    if (!m) return;
    if (!first) first = st;
    if (+m[1] * 60 + +m[2] <= mins) pick = st;
  });
  pick = pick || first;
  if (pick){
    pick.classList.add('stop-now');
    if (scroll) setTimeout(() => pick.scrollIntoView({behavior:'smooth', block:'center'}), 400);
  }
}
highlightToday(true);
setInterval(() => highlightToday(false), 5 * 60 * 1000);

// 左右滑動切換 DAY
(function enableSwipe(){
  let startX = 0, startY = 0, tracking = false;
  panels.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    tracking = true;
  }, {passive:true});
  panels.addEventListener('touchend', (e) => {
    if (!tracking) return;
    tracking = false;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    const idx = parseInt(currentDayKey, 10);
    if (isNaN(idx)) return;
    if (dx < 0 && idx < days.length - 1) selectPanel(String(idx + 1));
    else if (dx > 0 && idx > 0) selectPanel(String(idx - 1));
  }, {passive:true});
})();

// 輸入框清除鈕：用輸入框自己的背景圖畫 ✕（不另外浮動元件，捲動不會跑位），點右側就清空
(function(){
  const okEl = el => el.tagName === 'INPUT' && ['text','number','search'].includes(el.type) && !el.readOnly && !el.disabled && el.id !== 'shop-who' && el.placeholder !== '數量' && !el.closest('.shop-area');
  let queued = false;
  function sync(){
    queued = false;
    document.querySelectorAll('input').forEach(el => {
      if (!okEl(el)) return;
      el.classList.toggle('has-val', !!el.value && el.offsetWidth >= 90);
    });
  }
  function schedule(){ if (!queued){ queued = true; requestAnimationFrame(sync); } }
  document.addEventListener('input', schedule, true);
  document.addEventListener('change', schedule, true);
  new MutationObserver(schedule).observe(document.body, {childList: true, subtree: true});
  document.addEventListener('pointerdown', e => {
    const el = e.target;
    if (!el || !el.classList || !el.classList.contains('has-val') || !el.value) return;
    const r = el.getBoundingClientRect();
    if (e.clientX < r.right - 38) return;
    e.preventDefault();
    el.value = '';
    el.dispatchEvent(new Event('input', {bubbles: true}));
    if (el.hasAttribute('onchange')) el.dispatchEvent(new Event('change', {bubbles: true}));
    if (document.body.contains(el)) el.focus();
    schedule();
  }, true);
  schedule();
})();

function cpRender(){
  var el=document.getElementById('section-coupons');if(!el)return;
  var groups=[];COUPONS.forEach(function(c,i){var g=groups.filter(function(x){return x.name===c.g;})[0];if(!g){g={name:c.g,items:[]};groups.push(g);}g.items.push(i);});
  var html='<h2 class="day-title">優惠券</h2><span class="day-sub">結帳前出示。優惠內容和期限以優惠券頁面為準</span>';
  groups.forEach(function(g){
    var items=g.items.slice().sort(function(a,b){return (cpUsed[COUPONS[a].name]?1:0)-(cpUsed[COUPONS[b].name]?1:0);});
    html+='<div class="cp-group">'+g.name+'</div>';
    items.forEach(function(i){var c=COUPONS[i],u=!!cpUsed[c.name];
      html+='<div class="cp-card'+(u?' used':'')+'"><div class="cp-top">'+(CP_LOGO[c.name]?'<img class="cp-logo" src="'+CP_LOGO[c.name]+'" alt="">':'')+'<div class="cp-name">'+c.name+'</div></div>'
        +(c.off?'<div class="cp-off">'+c.off+'</div>':'')
        +(c.img&&window.CP_IMG&&CP_IMG[c.name]?'<img class="cp-img" src="'+CP_IMG[c.name]+'" alt="優惠券條碼" onclick="openTT(this.src)"><div class="cp-hint">點圖放大，結帳時出示條碼</div>':'')
        +(c.warn?'<div class="cp-warn">'+c.warn+'</div>':'')
        +cpExp(c.exp)
        +(c.tip?'<details class="cp-more"><summary>使用條件</summary><div class="cp-tip">'+c.tip+'</div></details>':'')
        +'<div class="cp-bottom">'+(c.url?'<a class="cp-open" href="'+c.url+'" target="_blank" rel="noopener">打開優惠券</a>':(c.img?'<span style="flex:1"></span>':'<span class="cp-open none">尚無連結</span>'))
        +'<label class="cp-used"><input type="checkbox" '+(u?'checked':'')+' onchange="cpToggle('+i+')">已使用</label></div>'
        +'</div>';});
  });
  el.innerHTML=html;
}
cpRender();
/* COUPONS-END */
</script>
</body>
</html>
