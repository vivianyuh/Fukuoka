<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>福岡・北九州 六天五夜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1ECE1;
    --panel:#FBF8F2;
    --ink:#1F2A3C;
    --ink-soft:#5B6474;
    --line:rgba(31,42,60,0.14);
    --vermilion:#C1440E;
    --moss:#5B7553;
    --gold:#B98A2E;
    --steel:#3E6285;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(circle at 10% 0%, rgba(62,98,133,0.06), transparent 40%),
      radial-gradient(circle at 90% 10%, rgba(193,68,14,0.05), transparent 35%);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    padding:28px 16px 60px;
    min-height:100vh;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:760px; margin:0 auto;}
  @media (max-width:400px){
    body{padding:18px 10px 50px;}
  }

  /* header */
  header{
    border-bottom:2px solid var(--ink);
    padding-bottom:18px;
    margin-bottom:22px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:12px;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.18em;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  h1{
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    font-size:clamp(28px,6vw,38px);
    margin:0;
    letter-spacing:0.02em;
  }
  .flight-badge{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    background:var(--ink);
    color:var(--bg);
    padding:8px 12px;
    border-radius:2px;
    text-align:right;
    line-height:1.6;
  }
  .flight-badge b{color:#F4C97B; font-weight:700;}

  /* day tabs — departure board style */
  .board{
    display:flex;
    gap:6px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    padding:6px 2px 10px;
    margin:0 -2px 24px;
    scrollbar-width:thin;
    position:sticky;
    top:0;
    z-index:10;
    background:var(--bg);
  }
  .board::-webkit-scrollbar{height:4px;}
  .tab{
    flex:0 0 auto;
    background:var(--panel);
    border:1px solid var(--line);
    border-bottom:3px solid transparent;
    border-radius:3px 3px 0 0;
    padding:12px 14px;
    cursor:pointer;
    min-width:96px;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    transition:all .18s ease;
  }
  .tab:hover{background:var(--white);}
  .tab.active{
    background:var(--ink);
    border-bottom:3px solid var(--vermilion);
  }
  .tab .d-num{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.1em;
    color:var(--ink-soft);
  }
  .tab.active .d-num{color:#B7C2D6;}
  .tab .d-date{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:15px;
    margin:2px 0 3px;
  }
  .tab.active .d-date{color:var(--bg);}
  .tab .d-theme{
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .tab.active .d-theme{color:#D7DCE5;}

  /* day panel */
  .panel{display:none;}
  .panel.active{display:block; animation:fade .35s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  .day-title{
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    font-size:22px;
    margin:0 0 2px;
  }
  .day-sub{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:20px;
    display:block;
  }

  /* timeline */
  .timeline{position:relative; padding-left:26px;}
  .timeline::before{
    content:"";
    position:absolute; left:6px; top:6px; bottom:6px;
    width:2px;
    background:repeating-linear-gradient(var(--line) 0 6px, transparent 6px 10px);
  }
  .stop{position:relative; margin-bottom:18px;}
  .stop::before{
    content:"";
    position:absolute; left:-26px; top:5px;
    width:10px; height:10px;
    border-radius:50%;
    background:var(--bg);
    border:2px solid var(--accent, var(--steel));
  }
  .stop-time{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:15px;
    color:var(--accent, var(--steel));
  }
  .stop-place{font-weight:700; font-size:15px; margin:2px 0 3px;}
  .stop-note{font-size:13px; color:var(--ink-soft); line-height:1.55;}
  .map-link{
    display:inline-flex;
    align-items:center;
    gap:3px;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    font-weight:700;
    color:var(--accent, var(--steel));
    text-decoration:none;
    border:1px solid currentColor;
    border-radius:10px;
    padding:4px 9px 4px 6px;
    margin-left:6px;
    vertical-align:middle;
    white-space:nowrap;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .map-link:hover{background:currentColor; color:var(--white) !important;}
  .map-link svg{width:9px; height:9px; flex:none;}
  .leg .p .map-link{margin-left:6px;}
  .tag{
    display:inline-block;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.06em;
    padding:2px 7px;
    border-radius:2px;
    color:var(--white);
    background:var(--accent, var(--steel));
    margin-right:6px;
    vertical-align:middle;
  }

  /* plan card */
  .plan-block{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:14px 16px;
    margin:10px 0 18px;
  }
  .plan-head{
    display:flex; gap:8px; margin-bottom:10px;
  }
  .plan-btn{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    font-weight:700;
    padding:8px 14px;
    border-radius:14px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink-soft);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .plan-btn.on{
    background:var(--ink);
    color:var(--bg);
    border-color:var(--ink);
  }
  .plan-body{display:none; font-size:13.5px; line-height:1.9;}
  .plan-body.on{display:block;}
  .leg{
    display:flex; justify-content:space-between; gap:10px;
    border-bottom:1px dashed var(--line);
    padding:4px 0;
  }
  .leg:last-child{border-bottom:none;}
  .leg .t{font-family:'JetBrains Mono', monospace; font-weight:700; white-space:nowrap;}
  .leg .p{color:var(--ink-soft); text-align:right;}

  .fare{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    background:#FBF3E4;
    border:1px dashed var(--gold);
    color:#7A5A17;
    padding:8px 12px;
    border-radius:4px;
    margin-top:8px;
  }
  .note-box{
    font-size:13px;
    color:var(--ink-soft);
    background:rgba(62,98,133,0.06);
    border-left:3px solid var(--steel);
    padding:8px 12px;
    border-radius:0 4px 4px 0;
    margin:10px 0;
  }

  /* meal recommendations */
  .meal-section{margin:22px 0 6px;}
  .meal-heading{
    display:flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .meal-heading::before{content:"";flex:0 0 14px; height:1px; background:var(--line);}
  .meal-heading::after{content:"";flex:1 1 auto; height:1px; background:var(--line);}
  .meal-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:3px solid var(--accent, var(--gold));
    border-radius:0 6px 6px 0;
    padding:12px 14px;
    margin-bottom:10px;
  }
  .meal-card-head{
    display:flex; justify-content:space-between; align-items:baseline; gap:8px;
    flex-wrap:wrap;
  }
  .meal-name{font-weight:700; font-size:14.5px;}
  .meal-type{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:var(--accent, var(--gold));
    letter-spacing:0.06em;
  }
  .meal-note{font-size:12.5px; color:var(--ink-soft); margin-top:4px; line-height:1.6;}
  .meal-tbd{
    font-size:12.5px;
    color:var(--ink-soft);
    font-style:italic;
    padding:10px 2px;
  }

  /* prep checklist */
  .tab.prep-tab{border-bottom-color:transparent;}
  .tab.prep-tab.active{border-bottom-color:var(--gold);}
  .prep-group{margin-bottom:22px;}
  .prep-group-title{
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    font-size:16px;
    margin-bottom:10px;
    display:flex; align-items:center; gap:8px;
  }
  .prep-group-title .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--accent, var(--gold));
    flex:none;
  }
  .prep-item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:12px 6px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .prep-group-body{
    display:grid;
    grid-template-columns:1fr 1fr;
    column-gap:18px;
  }
  .prep-group-body.cols-3{grid-template-columns:1fr 1fr 1fr;}
  .prep-group-body .prep-item:nth-last-child(1),
  .prep-group-body .prep-item:nth-last-child(2):nth-child(odd){
    border-bottom:none;
  }
  .prep-group-body.cols-3 .prep-item{border-bottom:1px solid var(--line);}
  @media (max-width:640px){
    .prep-group-body.cols-3{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:520px){
    .prep-group-body{grid-template-columns:1fr !important;}
    .prep-group-body .prep-item{border-bottom:1px solid var(--line);}
    .prep-group-body .prep-item:last-child{border-bottom:none;}
  }
  .prep-item:last-child{border-bottom:none;}
  .prep-check{
    flex:none;
    width:20px; height:20px;
    border:1.5px solid var(--ink-soft);
    border-radius:5px;
    margin-top:1px;
    position:relative;
    transition:all .15s ease;
  }
  .prep-item.checked .prep-check{
    background:var(--moss);
    border-color:var(--moss);
  }
  .prep-item.checked .prep-check::after{
    content:"";
    position:absolute; left:6px; top:2px;
    width:6px; height:11px;
    border:solid var(--white);
    border-width:0 2px 2px 0;
    transform:rotate(40deg);
  }
  .prep-text{flex:1;}
  .prep-item.checked .prep-main{
    color:var(--ink-soft);
    text-decoration:line-through;
    text-decoration-color:rgba(91,100,116,0.5);
  }
  .prep-main{font-size:14px; font-weight:500;}
  .prep-detail{font-size:12.5px; color:var(--ink-soft); margin-top:2px; line-height:1.55;}
  .prep-priority{
    font-family:'JetBrains Mono', monospace;
    font-size:9.5px;
    letter-spacing:0.06em;
    color:var(--vermilion);
    border:1px solid var(--vermilion);
    border-radius:3px;
    padding:1px 5px;
    margin-left:6px;
    white-space:nowrap;
  }

  /* hotel card */
  .hotel-card{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    background:var(--panel);
    border:1px solid var(--line);
    border-left:3px solid var(--moss);
    border-radius:0 6px 6px 0;
    padding:12px 16px;
    margin-bottom:22px;
  }
  .hotel-left{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .hotel-icon{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.08em;
    color:var(--moss);
    border:1px solid var(--moss);
    border-radius:3px;
    padding:2px 6px;
    flex:none;
  }
  .hotel-name{font-weight:700; font-size:14.5px;}
  .hotel-address{font-size:12px; color:var(--ink-soft);}
  .hotel-right{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    text-align:right;
    white-space:nowrap;
  }
  .hotel-right b{color:var(--ink);}

  /* weather tip */
  .weather-tip{
    display:flex; align-items:flex-start; gap:8px;
    background:rgba(62,98,133,0.06);
    border-left:3px solid var(--steel);
    border-radius:0 4px 4px 0;
    padding:8px 12px;
    font-size:12.5px;
    color:var(--ink-soft);
    margin:14px 0;
  }
  .weather-tip .w-icon{
    font-family:'JetBrains Mono', monospace;
    font-size:9.5px;
    letter-spacing:0.06em;
    color:var(--steel);
    border:1px solid var(--steel);
    border-radius:3px;
    padding:1px 5px;
    flex:none;
  }

  /* expense tracker - 優化版 */
  .expense-box{
    margin-top:20px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:16px;
  }
  .rate-box{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(185,138,46,0.1);
    border:1px solid var(--gold);
    border-radius:6px;
    padding:8px 12px;
    margin-bottom:14px;
    font-size:12.5px;
  }
  .rate-box label{font-weight:700; color:var(--ink);}
  .rate-input-wrap{display:flex; align-items:center; gap:4px;}
  .rate-input-wrap input{
    width:65px;
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:13px;
    text-align:center;
    padding:3px 6px;
    border:1px solid var(--line);
    border-radius:4px;
    background:var(--white);
  }
  .field-label{
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    margin:14px 0 6px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .sub-action{
    font-size:11px;
    color:var(--steel);
    cursor:pointer;
    font-weight:normal;
    text-decoration:underline;
  }
  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .chip-btn{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-family:inherit;
    font-size:13px;
    padding:7px 13px;
    border-radius:18px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink);
    cursor:pointer;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    transition:all .15s ease;
  }
  .chip-btn:active{transform:scale(0.96);}
  .chip-btn.active{
    background:var(--ink);
    color:var(--bg);
    border-color:var(--ink);
    font-weight:700;
  }
  .chip-btn.multi-active{
    background:var(--steel);
    color:var(--white);
    border-color:var(--steel);
    font-weight:700;
  }
  .twd-preview{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:var(--vermilion);
    margin-top:4px;
    text-align:right;
    min-height:16px;
  }
  .add-btn-main{
    width:100%;
    margin-top:16px;
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    font-weight:700;
    background:var(--ink);
    color:var(--bg);
    border:none;
    border-radius:6px;
    padding:12px 0;
    cursor:pointer;
    touch-action:manipulation;
    box-shadow:0 2px 6px rgba(31,42,60,0.15);
  }
  .add-btn-main:active{opacity:0.9; transform:scale(0.99);}

  .expense-row{
    display:flex; justify-content:space-between; align-items:center;
    gap:8px;
    padding:8px 0;
    border-bottom:1px dashed var(--line);
    font-size:13.5px;
  }
  .expense-row .e-desc{flex:1;}
  .expense-row .e-amt{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    text-align:right;
    white-space:nowrap;
  }
  .expense-row .e-amt .twd-sub{
    font-size:11px;
    font-weight:normal;
    color:var(--ink-soft);
    display:block;
  }
  .expense-row .e-del{
    flex:none;
    width:22px; height:22px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink-soft);
    font-size:13px;
    cursor:pointer;
    line-height:1;
    margin-left:4px;
  }
  .expense-add{
    display:flex; gap:8px; margin-top:8px;
  }
  .expense-add input{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:13.5px;
    border:1px solid var(--line);
    border-radius:4px;
    padding:8px 10px;
    background:var(--white);
    color:var(--ink);
  }
  .expense-add .e-desc-input{flex:1; min-width:0;}
  .expense-add .e-amt-input{width:110px; font-family:'JetBrains Mono', monospace;}
  .expense-sub{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid var(--line);
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    font-weight:700;
  }
  .expense-sub .twd-total{
    font-size:12px;
    color:var(--vermilion);
    margin-left:6px;
  }
  .trip-total{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    text-align:right;
  }
  .trip-total b{color:var(--vermilion); font-size:14px;}

  /* app sections + bottom nav */
  body{padding-bottom:86px;}
  .section{display:none;}
  .section.active{display:block; animation:fade .3s ease;}
  .bottom-nav{
    position:fixed;
    left:0; right:0; bottom:0;
    display:flex;
    background:var(--panel);
    border-top:1px solid var(--line);
    z-index:50;
    padding-bottom:env(safe-area-inset-bottom, 0);
    box-shadow:0 -2px 10px rgba(31,42,60,0.06);
  }
  .nav-btn{
    flex:1;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:10px 0 8px;
    background:none; border:none;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:10.5px;
    color:var(--ink-soft);
    cursor:pointer;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    border-top:2px solid transparent;
  }
  .nav-btn .nav-icon{font-size:19px; line-height:1;}
  .nav-btn.active{color:var(--ink); border-top-color:var(--vermilion);}

  /* people chips */
  .people-manage{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    margin-bottom:14px; padding-bottom:14px;
    border-bottom:1px solid var(--line);
  }
  .people-label{
    font-family:'JetBrains Mono', monospace;
    font-size:11px; letter-spacing:0.08em;
    color:var(--ink-soft); flex:none;
  }
  .person-chip{
    display:inline-flex; align-items:center; gap:5px;
    font-size:12.5px;
    padding:5px 6px 5px 12px;
    border-radius:16px;
    border:1px solid var(--line);
    background:var(--white);
  }
  .person-chip .p-del{
    width:16px; height:16px;
    border-radius:50%;
    background:var(--line);
    color:var(--ink-soft);
    font-size:11px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .person-add{display:flex; gap:6px;}
  .person-add input{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:12.5px;
    border:1px solid var(--line);
    border-radius:16px;
    padding:5px 12px;
    width:110px;
    background:var(--white);
    color:var(--ink);
  }
  .person-add button{
    font-size:12px; font-weight:700;
    border:1px solid var(--line);
    border-radius:50%;
    width:26px; height:26px;
    background:var(--white);
    color:var(--ink-soft);
    cursor:pointer;
  }

  .e-cat{font-size:13px; margin-right:4px;}
  .e-payer{
    font-size:10.5px;
    color:var(--ink-soft);
    display:block;
    margin-top:1px;
  }

  /* settlement */
  .settle-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:14px 0;}
  .settle-card{
    background:var(--white);
    border-radius:6px;
    padding:10px 12px;
    border:1px solid var(--line);
  }

      {type:"備選", name:"一蘭拉麵 中洲川端總本店 / 華味鳥水炊鍋", note:"想吃拉麵可選一蘭總本店的「味集中座位」；想吃雞肉鍋可選博多華味鳥。", map:"一蘭ラーメン 中洲川端総本店"}
    ]
  },
  {
    date:"11/11", wd:"三", theme:"賦歸", accent:"var(--ink-soft)",
    weather:"機場室內空調偏冷，登機前建議薄外套不要收進託運行李。",
    stops:[
      {time:"12:15→13:50", place:"長榮 BR105 FUK → TPE", note:"抵達桃園機場", tag:"FLIGHT", map:"福岡空港"}
    ],
    plans:[], fare:"", note:"中午起飛，建議至少提前 2 小時抵達機場辦理登機（約 10:15 前到）。",
    empty:true,
    placeholderText:"上午還有一段空檔（約到 10:00 左右）— 要不要幫你排在飯店附近做最後採買，或安排寄放行李後的短程行程？"
  }
];

const board = document.getElementById('board');
const panels = document.getElementById('panels');

// --- 行前準備 tab ---
const prepPanel = document.getElementById('section-prep');
const prepGroupsHtml = prep.map(g => `
  <div class="prep-group" style="--accent:${g.accent}">
    <div class="prep-group-title"><span class="dot"></span>${g.title}</div>
    ${g.items.map(it => `
      <div class="prep-item" style="--accent:${g.accent}">
        <div class="prep-check"></div>
        <div class="prep-text">
          <div class="prep-main">${it.text}${it.priority ? `<span class="prep-priority">${it.priority}</span>` : ''}</div>
          ${it.detail ? `<div class="prep-detail">${it.detail}</div>` : ''}
        </div>
      </div>`).join('')}
  </div>`).join('');
prepPanel.innerHTML = `
  <h2 class="day-title">行前準備須知</h2>
  <span class="day-sub">出發前可以勾選確認・點項目即可打勾</span>
  ${prepGroupsHtml}`;

document.addEventListener('click', (e) => {
  const item = e.target.closest('.prep-item');
  if (item) { item.classList.toggle('checked'); return; }
});

// --- 行李清單 tab ---
const packPanel = document.getElementById('section-packing');
const packGroupsHtml = packing.map(g => `
  <div class="prep-group" style="--accent:${g.accent}">
    <div class="prep-group-title"><span class="dot"></span>${g.title}</div>
    <div class="prep-group-body${g.cols===3 ? ' cols-3' : ''}">
    ${g.items.map(txt => `
      <div class="prep-item" style="--accent:${g.accent}">
        <div class="prep-check"></div>
        <div class="prep-text">
          <div class="prep-main">${txt}${(g.mustHave && g.mustHave.includes(txt)) ? `<span class="prep-priority">必備</span>` : ''}</div>
        </div>
      </div>`).join('')}
    </div>
  </div>`).join('');
packPanel.innerHTML = `
  <h2 class="day-title">出國行李清單</h2>
  <span class="day-sub">打包時可逐項點選打勾</span>
  ${packGroupsHtml}`;

days.forEach((d, i) => {
  const tab = document.createElement('div');
  tab.className = 'tab' + (i === 0 ? ' active' : '');
  tab.dataset.key = String(i);
  tab.innerHTML = `<div class="d-num">DAY ${i+1}</div><div class="d-date">${d.date}</div><div class="d-theme">${d.wd}・${d.theme}</div>`;
  tab.onclick = () => selectPanel(String(i));
  board.appendChild(tab);

  const panel = document.createElement('div');
  panel.className = 'panel' + (i === 0 ? ' active' : '');
  panel.dataset.key = String(i);

  function buildMealsHtml(meals, accent){
    if (!meals || !meals.length) {
      return `<div class="meal-section"><div class="meal-heading">餐廳</div><div class="meal-tbd">尚未決定 — 之後補上</div></div>`;
    }
    const cards = meals.map(m => `
      <div class="meal-card" style="--accent:${accent}">
        <div class="meal-card-head">
          <div class="meal-name">${m.name}${m.map ? mapA(m.map) : ''}</div>
          <div class="meal-type">${m.type}</div>
        </div>
        ${m.note ? `<div class="meal-note">${m.note}</div>` : ''}
      </div>`).join('');
    return `<div class="meal-section"><div class="meal-heading">餐廳建議・待確認</div>${cards}</div>`;
  }
  const weatherHtml = d.weather ? `<div class="weather-tip"><span class="w-icon">天氣</span><div>${d.weather}</div></div>` : '';

  if (d.empty) {
    let stopsHtml = '';
    (d.stops || []).forEach(s => {
      stopsHtml += `
        <div class="stop" style="--accent:${d.accent}">
          ${s.tag ? `<span class="tag" style="--accent:${d.accent}">${s.tag}</span>` : ''}
          <div class="stop-time">${s.time}</div>
          <div class="stop-place">${s.place}${s.map ? mapA(s.map) : ''}</div>
          ${s.note ? `<div class="stop-note">${s.note}</div>` : ''}
        </div>`;
    });
    panel.innerHTML = `
      <h2 class="day-title">DAY ${i+1} · ${d.date}（${d.wd}）</h2>
      <span class="day-sub">${d.theme}</span>
      ${weatherHtml}
      ${stopsHtml ? `<div class="timeline">${stopsHtml}</div>` : ''}
      ${d.note ? `<div class="note-box">${d.note}</div>` : ''}
      <div class="placeholder">
        <div class="big">尚未安排</div>
        <div>${d.placeholderText}</div>
      </div>
      ${buildMealsHtml(d.meals, d.accent)}`;
    panels.appendChild(panel);
    return;
  }

  let stopsHtml = '';
  d.stops.forEach(s => {
    stopsHtml += `
      <div class="stop" style="--accent:${d.accent}">
        ${s.tag ? `<span class="tag" style="--accent:${d.accent}">${s.tag}</span>` : ''}
        <div class="stop-time">${s.time}</div>
        <div class="stop-place">${s.place}${s.map ? mapA(s.map) : ''}</div>
        ${s.note ? `<div class="stop-note">${s.note}</div>` : ''}
      </div>`;
  });

  let plansHtml = '';
  d.plans.forEach((p, pi) => {
    const btns = p.options.map((o, oi) => `<button class="plan-btn ${oi===0?'on':''}" data-pi="${pi}" data-oi="${oi}">${o}</button>`).join('');
    const bodies = p.bodies.map((b, oi) => `<div class="plan-body ${oi===0?'on':''}" data-pi="${pi}" data-oi="${oi}">${b}</div>`).join('');
    plansHtml += `
      <div class="plan-block" style="--accent:${d.accent}">
        <div style="font-size:12px;color:var(--ink-soft);margin-bottom:8px;font-family:'JetBrains Mono',monospace;">${p.label}</div>
        <div class="plan-head">${btns}</div>
        ${bodies}
      </div>`;
  });

  panel.innerHTML = `
    <h2 class="day-title">DAY ${i+1} · ${d.date}（${d.wd}）</h2>
    <span class="day-sub">${d.theme}</span>
    ${weatherHtml}
    <div class="timeline">${stopsHtml}</div>
    ${plansHtml}
    ${d.fare ? `<div class="fare">${d.fare}</div>` : ''}
    ${d.note ? `<div class="note-box">${d.note}</div>` : ''}
    ${buildMealsHtml(d.meals, d.accent)}
  `;
  panels.appendChild(panel);
});

// --- 花費 tab (全新換匯與優化介面版) ---
const EXPENSE_KEY = 'fukuoka_trip_expenses_v2';
const PEOPLE_KEY = 'fukuoka_trip_people_v1';
const RATE_KEY = 'fukuoka_trip_rate_v1';

const CATEGORIES = [
  {key:'food', emoji:'🍜', label:'吃的'},
  {key:'play', emoji:'🎡', label:'玩的'},
  {key:'ticket', emoji:'🎫', label:'門票'},
  {key:'shop', emoji:'🛍️', label:'購物'},
  {key:'other', emoji:'📦', label:'其他'}
];
function catInfo(key){ return CATEGORIES.find(c => c.key === key) || CATEGORIES[CATEGORIES.length-1]; }

function loadExpenses(){
  try {
    const raw = localStorage.getItem(EXPENSE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e){ return []; }
}
function saveExpenses(){
  try { localStorage.setItem(EXPENSE_KEY, JSON.stringify(expenseEntries)); } catch(e){}
}
function loadPeople(){
  try {
    const raw = localStorage.getItem(PEOPLE_KEY);
    return raw ? JSON.parse(raw) : ['你', '皮皮'];
  } catch(e){ return ['你', '皮皮']; }
}
function savePeople(){
  try { localStorage.setItem(PEOPLE_KEY, JSON.stringify(people)); } catch(e){}
}
function loadRate(){
  try {
    const r = localStorage.getItem(RATE_KEY);
    return r ? parseFloat(r) : 0.215;
  } catch(e){ return 0.215; }
}
function saveRate(r){
  try { localStorage.setItem(RATE_KEY, String(r)); } catch(e){}
}

let expenseEntries = loadExpenses();
let people = loadPeople();
let currentRate = loadRate();

let lastCategory = CATEGORIES[0].key;
let lastPaidBy = people[0] || '你';
let pendingSplit = null;

const expensePanel = document.getElementById('section-expense');
const dayOptionsHtml = days.map((d, i) => `<option value="${i}">DAY ${i+1}・${d.date}（${d.wd}）${d.theme}</option>`).join('');

expensePanel.innerHTML = `
  <h2 class="day-title">全程花費記錄</h2>
  <span class="day-sub">資料自動保存在手機中，支援即時匯率換算與轉帳結算</span>
  <div class="expense-box">

    <!-- 匯率設定 -->
    <div class="rate-box">
      <label>匯率換算 (JPY ➔ TWD)</label>
      <div class="rate-input-wrap">
        <span>1 円 = </span>
        <input type="number" step="0.001" id="rate-input" value="${currentRate}" onchange="updateRate(this.value)">
        <span>台幣</span>
      </div>
    </div>

    <!-- 旅伴管理 -->
    <div class="people-manage">
      <span class="people-label">旅伴</span>
      <div id="people-chips" style="display:flex; gap:6px; flex-wrap:wrap;"></div>
      <div class="person-add">
        <input type="text" id="new-person-input" placeholder="新增旅伴">
        <button onclick="addPerson()">+</button>
      </div>
    </div>

    <!-- 輸入區域 -->
    <select id="e-day-select" style="width:100%;font-family:'Zen Kaku Gothic New',sans-serif;font-size:13.5px;border:1px solid var(--line);border-radius:6px;padding:9px 10px;background:var(--white);color:var(--ink);margin-bottom:8px;">
      ${dayOptionsHtml}
    </select>
    
    <div class="expense-add">
      <input type="text" class="e-desc-input" id="e-desc" placeholder="品項，如：牛腸鍋、車資">
      <input type="number" class="e-amt-input" id="e-amt" placeholder="日圓 (円)" oninput="previewTwd()">
    </div>
    <div class="twd-preview" id="twd-preview"></div>

    <div class="field-label"><span>分類</span></div>
    <div class="chip-row" id="cat-row"></div>

    <div class="field-label"><span>誰先付的</span></div>
    <div class="chip-row" id="payer-row"></div>

    <div class="field-label">
      <span>這筆算誰的</span>
      <div>
        <span class="sub-action" onclick="selectAllSplit()">全選均分</span> · 
        <span class="sub-action" onclick="selectSelfSplit()">僅自己</span>
      </div>
    </div>
    <div class="chip-row" id="split-row"></div>

    <button class="add-btn-main" onclick="addExpense()">＋ 加入花費紀錄</button>

    <div id="expense-groups" style="margin-top:20px;"></div>
    
    <div class="expense-sub">
      <span>全程總計</span>
      <div>
        <span id="expense-grand-total">¥0</span>
        <span class="twd-total" id="expense-grand-twd">(NT$ 0)</span>
      </div>
    </div>

    <div class="field-label" style="margin-top:24px; font-size:14px; font-weight:700;">結算總覽（自動換算台幣）</div>
    <div class="settle-grid" id="settle-grid"></div>
    <div id="settle-suggestions"></div>
  </div>
`;

function updateRate(val){
  const r = parseFloat(val);
  if (!isNaN(r) && r > 0) {
    currentRate = r;
    saveRate(r);
    previewTwd();
    renderExpenses();
  }
}

function previewTwd(){
  const amt = parseFloat(document.getElementById('e-amt').value);
  const prevEl = document.getElementById('twd-preview');
  if (!isNaN(amt) && amt > 0) {
    const twd = Math.round(amt * currentRate);
    prevEl.textContent = `約等於 NT$ ${twd.toLocaleString()}`;
  } else {
    prevEl.textContent = '';
  }
}

function renderPeopleChips(){
  document.getElementById('people-chips').innerHTML = people.map(p => `
    <span class="person-chip">${p}<span class="p-del" onclick="removePerson('${p.replace(/'/g,"\\'")}')">×</span></span>
  `).join('');
  renderPickerRows();
}

function addPerson(){
  const input = document.getElementById('new-person-input');
  const name = input.value.trim();
  if (!name || people.includes(name)) return;
  people.push(name);
  savePeople();
  input.value = '';
  renderPeopleChips();
}

function removePerson(name){
  people = people.filter(p => p !== name);
  if (!people.length) people = ['你'];
  savePeople();
  if (pendingSplit) pendingSplit = pendingSplit.filter(p => people.includes(p));
  renderPeopleChips();
  renderExpenses();
}

function renderPickerRows(){
  if (!lastPaidBy || !people.includes(lastPaidBy)) lastPaidBy = people[0];
  if (!pendingSplit) pendingSplit = [...people];
  else pendingSplit = pendingSplit.filter(p => people.includes(p));

  document.getElementById('cat-row').innerHTML = CATEGORIES.map(c => `
    <button type="button" class="chip-btn ${c.key === lastCategory ? 'active' : ''}" onclick="pickCategory('${c.key}')">${c.emoji} ${c.label}</button>
  `).join('');

  document.getElementById('payer-row').innerHTML = people.map(p => `
    <button type="button" class="chip-btn ${p === lastPaidBy ? 'active' : ''}" onclick="pickPayer('${p.replace(/'/g,"\\'")}')">${p}</button>
  `).join('');

  document.getElementById('split-row').innerHTML = people.map(p => `
    <button type="button" class="chip-btn ${pendingSplit.includes(p) ? 'multi-active' : ''}" onclick="toggleSplit('${p.replace(/'/g,"\\'")}')">
      ${pendingSplit.includes(p) ? '✓ ' : ''}${p}
    </button>
  `).join('');
}

function pickCategory(key){ lastCategory = key; renderPickerRows(); }
function pickPayer(name){ lastPaidBy = name; renderPickerRows(); }
function toggleSplit(name){
  if (pendingSplit.includes(name)) {
    if (pendingSplit.length > 1) pendingSplit = pendingSplit.filter(p => p !== name);
  } else {
    pendingSplit.push(name);
  }
  renderPickerRows();
}
function selectAllSplit(){ pendingSplit = [...people]; renderPickerRows(); }
function selectSelfSplit(){ pendingSplit = [lastPaidBy]; renderPickerRows(); }

function addExpense(){
  const dayIndex = parseInt(document.getElementById('e-day-select').value, 10);
  const descInput = document.getElementById('e-desc');
  const amtInput = document.getElementById('e-amt');
  const desc = descInput.value.trim();
  const amt = parseFloat(amtInput.value);
  if (!desc || isNaN(amt) || amt <= 0) return;
  if (!pendingSplit || !pendingSplit.length) pendingSplit = [lastPaidBy];

  expenseEntries.push({
    dayIndex, desc, amt,
    category: lastCategory,
    paidBy: lastPaidBy,
    splitWith: [...pendingSplit]
  });

  descInput.value = '';
  amtInput.value = '';
  document.getElementById('twd-preview').textContent = '';
  saveExpenses();
  renderExpenses();
}

function deleteExpense(idx){
  expenseEntries.splice(idx, 1);
  saveExpenses();
  renderExpenses();
}

function renderExpenses(){
  const groupsEl = document.getElementById('expense-groups');
  const grandEl = document.getElementById('expense-grand-total');
  const grandTwdEl = document.getElementById('expense-grand-twd');
  if (!groupsEl) return;

  let grand = 0;
  let html = '';

  days.forEach((d, di) => {
    const items = expenseEntries.map((e, idx) => ({...e, idx})).filter(e => e.dayIndex === di);
    if (!items.length) return;
    const subtotal = items.reduce((s, e) => s + e.amt, 0);
    grand += subtotal;

    html += `<div class="prep-group" style="--accent:${d.accent}">
      <div class="prep-group-title"><span class="dot"></span>DAY ${di+1}・${d.date}（${d.wd}）${d.theme}</div>
      ${items.map(e => {
        const c = catInfo(e.category);
        const splitLabel = e.splitWith.length === people.length ? '全體均分' : e.splitWith.join('、');
        const twd = Math.round(e.amt * currentRate);
        return `
        <div class="expense-row">
          <span class="e-desc">
            <span class="e-cat">${c.emoji}</span>${e.desc}
            <span class="e-payer">${e.paidBy} 付 · ${splitLabel}</span>
          </span>
          <span class="e-amt">
            ¥${e.amt.toLocaleString()}
            <span class="twd-sub">NT$ ${twd.toLocaleString()}</span>
          </span>
          <span class="e-del" onclick="deleteExpense(${e.idx})">×</span>
        </div>`;
      }).join('')}
      <div class="expense-sub" style="border-top:none;padding-top:4px;margin-top:4px;">
        <span>日圓小計</span>
        <span>¥${subtotal.toLocaleString()} <span class="twd-total">(NT$ ${Math.round(subtotal * currentRate).toLocaleString()})</span></span>
      </div>
    </div>`;
  });

  groupsEl.innerHTML = html || `<div class="meal-tbd">目前還沒有花費記錄</div>`;
  grandEl.textContent = '¥' + grand.toLocaleString();
  const grandTwd = Math.round(grand * currentRate);
  grandTwdEl.textContent = `(NT$ ${grandTwd.toLocaleString()})`;

  const headerTotal = document.getElementById('trip-total-amt');
  if (headerTotal) headerTotal.textContent = '¥' + grand.toLocaleString();

  renderSettlement();
}

function renderSettlement(){
  const grid = document.getElementById('settle-grid');
  const sugEl = document.getElementById('settle-suggestions');
  if (!grid) return;

  const paid = {}, owed = {};
  people.forEach(p => { paid[p] = 0; owed[p] = 0; });

  expenseEntries.forEach(e => {
    paid[e.paidBy] = (paid[e.paidBy] || 0) + e.amt;
    const share = e.amt / e.splitWith.length;
    e.splitWith.forEach(p => { owed[p] = (owed[p] || 0) + share; });
  });

  const netTwd = {};
  people.forEach(p => {
    const netJpy = paid[p] - owed[p];
    netTwd[p] = Math.round(netJpy * currentRate);
  });

  grid.innerHTML = people.map(p => {
    const paidTwd = Math.round(paid[p] * currentRate);
    const owedTwd = Math.round(owed[p] * currentRate);
    return `
    <div class="settle-card">
      <div class="settle-name">${p}</div>
      <div class="settle-amt">NT$ ${paidTwd.toLocaleString()}</div>
      <div class="settle-sub">實付 ¥${Math.round(paid[p]).toLocaleString()}</div>
      <div class="settle-sub" style="color:var(--ink-soft)">應分攤 NT$ ${owedTwd.toLocaleString()}</div>
    </div>`;
  }).join('');

  const creditors = people.filter(p => netTwd[p] > 1).map(p => ({p, amt: netTwd[p]})).sort((a,b) => b.amt - a.amt);
  const debtors = people.filter(p => netTwd[p] < -1).map(p => ({p, amt: -netTwd[p]})).sort((a,b) => b.amt - a.amt);

  const settlements = [];
  let ci = 0, di = 0;
  while (ci < creditors.length && di < debtors.length) {
    const amt = Math.min(creditors[ci].amt, debtors[di].amt);
    settlements.push({from: debtors[di].p, to: creditors[ci].p, amt: Math.round(amt)});
    creditors[ci].amt -= amt;
    debtors[di].amt -= amt;
    if (creditors[ci].amt < 1) ci++;
    if (debtors[di].amt < 1) di++;
  }

  sugEl.innerHTML = settlements.length
    ? settlements.map(s => `<div class="settle-row"><span>${s.from}</span><span>➔ 應轉給</span><b>${s.to}</b><span style="margin-left:auto; font-weight:700;">NT$ ${s.amt.toLocaleString()}</span></div>`).join('')
    : `<div class="meal-tbd">所有花費均已算平，不需要互相轉帳</div>`;
}

renderPeopleChips();
renderExpenses();

function selectPanel(key){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.key === key));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.dataset.key === key));
}

function selectSection(sec){
  document.querySelectorAll('.section').forEach(s => s.classList.toggle('active', s.id === 'section-' + sec));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.section === sec));
}
selectSection('itinerary');

panels.addEventListener('click', (e) => {
  const btn = e.target.closest('.plan-btn');
  if (!btn) return;
  const pi = btn.dataset.pi;
  const block = btn.closest('.plan-block');
  block.querySelectorAll(`.plan-btn[data-pi="${pi}"]`).forEach(b => b.classList.toggle('on', b === btn));
  block.querySelectorAll(`.plan-body[data-pi="${pi}"]`).forEach(b => b.classList.toggle('on', b.dataset.oi === btn.dataset.oi));
});
</script>
