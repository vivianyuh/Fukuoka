<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="福岡行程">
<meta name="theme-color" content="#1F2A3C">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light;
    --bg:#F1ECE1;
    --panel:#FBF8F2;
    --ink:#1F2A3C;
    --ink-soft:#5B6474;
    --line:rgba(31,42,60,0.14);
    --vermilion:#C1440E;
    --moss:#5B7553;
    --gold:#B98A2E;
    --steel:#3E6285;
    --white:#FFFFFF;
  }
  body, .tab, .panel, .prep-group, .plan-block, .meal-card, .hotel-card, .fare, .note-box, .expense-box, .weather-tip{
    transition: background-color .25s ease, color .25s ease, border-color .25s ease;
  }
  *{box-sizing:border-box;}
  input, select, textarea{
    font-size:16px !important;
  }
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(circle at 10% 0%, rgba(62,98,133,0.06), transparent 40%),
      radial-gradient(circle at 90% 10%, rgba(193,68,14,0.05), transparent 35%);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    padding:28px 16px 60px;
    min-height:100vh;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:760px; margin:0 auto;}
  @media (max-width:400px){
    body{padding:18px 10px 50px;}
  }

  /* header */
  header{
    border-bottom:2px solid var(--ink);
    padding-bottom:18px;
    margin-bottom:22px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:12px;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.18em;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  h1{
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    font-size:clamp(28px,6vw,38px);
    margin:0;
    letter-spacing:0.02em;
  }
  .flight-badge{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    background:var(--ink);
    color:var(--bg);
    padding:8px 12px;
    border-radius:2px;
    text-align:right;
    line-height:1.6;
  }
  .flight-badge b{color:#F4C97B; font-weight:700;}

  /* day tabs — departure board style */
  .board{
    display:flex;
    gap:6px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    padding:6px 2px 10px;
    margin:0 -2px 24px;
    scrollbar-width:thin;
    position:sticky;
    top:0;
    z-index:10;
    background:var(--bg);
  }
  .board::-webkit-scrollbar{height:4px;}
  .tab{
    flex:0 0 auto;
    background:var(--panel);
    border:1px solid var(--line);
    border-bottom:3px solid transparent;
    border-radius:3px 3px 0 0;
    padding:12px 14px;
    cursor:pointer;
    min-width:96px;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    transition:all .18s ease;
  }
  .tab:hover{background:var(--white);}
  .tab.active{
    background:var(--ink);
    border-bottom:3px solid var(--vermilion);
  }
  .tab .d-num{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.1em;
    color:var(--ink-soft);
  }
  .tab.active .d-num{color:#B7C2D6;}
  .tab .d-date{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:15px;
    margin:2px 0 3px;
  }
  .tab.active .d-date{color:var(--bg);}
  .today-badge{
    display:inline-block;
    font-family:'JetBrains Mono', monospace;
    font-size:8.5px;
    font-weight:700;
    letter-spacing:0.04em;
    background:var(--vermilion);
    color:var(--white);
    border-radius:3px;
    padding:1px 4px;
    margin-left:5px;
    vertical-align:middle;
  }
  .tab .d-theme{
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .tab.active .d-theme{color:#D7DCE5;}

  /* day panel */
  .panel{display:none;}
  .panel.active{display:block; animation:fade .35s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  .day-title{
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    font-size:22px;
    margin:0 0 2px;
  }
  .day-sub{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:20px;
    display:block;
  }

  /* timeline */
  .timeline{position:relative; padding-left:26px;}
  .timeline::before{
    content:"";
    position:absolute; left:6px; top:6px; bottom:6px;
    width:2px;
    background:repeating-linear-gradient(var(--line) 0 6px, transparent 6px 10px);
  }
  .stop{position:relative; margin-bottom:18px;}
  .stop::before{
    content:"";
    position:absolute; left:-26px; top:5px;
    width:10px; height:10px;
    border-radius:50%;
    background:var(--bg);
    border:2px solid var(--accent, var(--steel));
  }
  .stop-time{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:15px;
    color:var(--accent, var(--steel));
  }
  .stop-place{font-weight:700; font-size:15px; margin:2px 0 3px;}
  .stop-note{font-size:13px; color:var(--ink-soft); line-height:1.55;}
  .stop-maybe{opacity:0.72;}
  .stop-maybe::before{
    background:transparent;
    border-style:dashed;
  }
  .stop-maybe .stop-place{font-style:italic;}
  .map-link{
    display:inline-flex;
    align-items:center;
    gap:3px;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    font-weight:700;
    color:var(--accent, var(--steel));
    text-decoration:none;
    border:1px solid currentColor;
    border-radius:10px;
    padding:4px 9px 4px 6px;
    margin-left:6px;
    vertical-align:middle;
    white-space:nowrap;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .map-link:hover{background:currentColor; color:var(--white) !important;}
  .map-link svg{width:9px; height:9px; flex:none;}
  .leg .p .map-link{margin-left:6px;}
  .tag{
    display:inline-block;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.06em;
    padding:2px 7px;
    border-radius:2px;
    color:var(--white);
    background:var(--accent, var(--steel));
    margin-right:6px;
    vertical-align:middle;
  }

  /* plan card */
  .plan-block{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:14px 16px;
    margin:10px 0 18px;
  }
  .plan-head{
    display:flex; gap:8px; margin-bottom:10px;
  }
  .plan-btn{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    font-weight:700;
    padding:8px 14px;
    border-radius:14px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink-soft);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .plan-btn.on{
    background:var(--ink);
    color:var(--bg);
    border-color:var(--ink);
  }
  .plan-body{display:none; font-size:13.5px; line-height:1.9;}
  .plan-body.on{display:block;}
  .leg{
    display:flex; justify-content:space-between; gap:10px;
    border-bottom:1px dashed var(--line);
    padding:4px 0;
  }
  .leg:last-child{border-bottom:none;}
  .leg .t{font-family:'JetBrains Mono', monospace; font-weight:700; white-space:nowrap;}
  .leg .p{color:var(--ink-soft); text-align:right;}

  .fare{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    background:#FBF3E4;
    border:1px dashed var(--gold);
    color:#7A5A17;
    padding:8px 12px;
    border-radius:4px;
    margin-top:8px;
  }
  .note-box{
    font-size:13px;
    color:var(--ink-soft);
    background:rgba(62,98,133,0.06);
    border-left:3px solid var(--steel);
    padding:8px 12px;
    border-radius:0 4px 4px 0;
    margin:10px 0;
  }

  /* meal recommendations */
  .meal-section{margin:22px 0 6px;}
  .meal-heading{
    display:flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .meal-heading::before{content:"";flex:0 0 14px; height:1px; background:var(--line);}
  .meal-heading::after{content:"";flex:1 1 auto; height:1px; background:var(--line);}
  .meal-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:3px solid var(--accent, var(--gold));
    border-radius:0 6px 6px 0;
    padding:12px 14px;
    margin-bottom:10px;
  }
  .meal-card-head{
    display:flex; justify-content:space-between; align-items:baseline; gap:8px;
    flex-wrap:wrap;
  }
  .meal-name{font-weight:700; font-size:14.5px;}
  .meal-type{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:var(--accent, var(--gold));
    letter-spacing:0.06em;
  }
  .meal-note{font-size:12.5px; color:var(--ink-soft); margin-top:4px; line-height:1.6;}
  .meal-tbd{
    font-size:12.5px;
    color:var(--ink-soft);
    font-style:italic;
    padding:10px 2px;
  }

  /* prep checklist */
  .tab.prep-tab{border-bottom-color:transparent;}
  .tab.prep-tab.active{border-bottom-color:var(--gold);}
  .prep-group{margin-bottom:22px;}
  .prep-group-title{
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    font-size:16px;
    margin-bottom:10px;
    display:flex; align-items:center; gap:8px;
  }
  .prep-group-title .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--accent, var(--gold));
    flex:none;
  }
  .prep-item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:12px 6px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .prep-group-body{
    display:grid;
    grid-template-columns:1fr 1fr;
    column-gap:18px;
  }
  .prep-group-body.cols-3{grid-template-columns:1fr 1fr 1fr;}
  .prep-group-body .prep-item:nth-last-child(1),
  .prep-group-body .prep-item:nth-last-child(2):nth-child(odd){
    border-bottom:none;
  }
  .prep-group-body.cols-3 .prep-item{border-bottom:1px solid var(--line);}
  @media (max-width:640px){
    .prep-group-body.cols-3{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:520px){
    .prep-group-body{grid-template-columns:1fr !important;}
    .prep-group-body .prep-item{border-bottom:1px solid var(--line);}
    .prep-group-body .prep-item:last-child{border-bottom:none;}
  }
  .prep-item:last-child{border-bottom:none;}
  .prep-check{
    flex:none;
    width:20px; height:20px;
    border:1.5px solid var(--ink-soft);
    border-radius:5px;
    margin-top:1px;
    position:relative;
    transition:all .15s ease;
  }
  .prep-item.checked .prep-check{
    background:var(--moss);
    border-color:var(--moss);
  }
  .prep-item.checked .prep-check::after{
    content:"";
    position:absolute; left:6px; top:2px;
    width:6px; height:11px;
    border:solid var(--white);
    border-width:0 2px 2px 0;
    transform:rotate(40deg);
  }
  .prep-text{flex:1;}
  .prep-item.checked .prep-main{
    color:var(--ink-soft);
    text-decoration:line-through;
    text-decoration-color:rgba(91,100,116,0.5);
  }
  .prep-main{font-size:14px; font-weight:500;}
  .prep-detail{font-size:12.5px; color:var(--ink-soft); margin-top:2px; line-height:1.55;}
  .prep-priority{
    font-family:'JetBrains Mono', monospace;
    font-size:9.5px;
    letter-spacing:0.06em;
    color:var(--vermilion);
    border:1px solid var(--vermilion);
    border-radius:3px;
    padding:1px 5px;
    margin-left:6px;
    white-space:nowrap;
  }

  /* hotel card */
  .hotel-card{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    background:var(--panel);
    border:1px solid var(--line);
    border-left:3px solid var(--moss);
    border-radius:0 6px 6px 0;
    padding:12px 16px;
    margin-bottom:22px;
  }
  .hotel-left{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .hotel-icon{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.08em;
    color:var(--moss);
    border:1px solid var(--moss);
    border-radius:3px;
    padding:2px 6px;
    flex:none;
  }
  .hotel-name{font-weight:700; font-size:14.5px;}
  .hotel-address{font-size:12px; color:var(--ink-soft);}
  .hotel-right{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    text-align:right;
    white-space:nowrap;
  }
  .hotel-right b{color:var(--ink);}

  /* weather tip */
  .weather-tip{
    display:flex; align-items:flex-start; gap:8px;
    background:rgba(62,98,133,0.06);
    border-left:3px solid var(--steel);
    border-radius:0 4px 4px 0;
    padding:8px 12px;
    font-size:12.5px;
    color:var(--ink-soft);
    margin:14px 0;
  }
  .weather-tip .w-icon{
    font-family:'JetBrains Mono', monospace;
    font-size:9.5px;
    letter-spacing:0.06em;
    color:var(--steel);
    border:1px solid var(--steel);
    border-radius:3px;
    padding:1px 5px;
    flex:none;
  }

  /* expense tracker */
  .expense-box{
    margin-top:24px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:14px 16px;
  }
  .expense-title{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.1em;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .expense-row{
    display:flex; justify-content:space-between; align-items:center;
    gap:8px;
    padding:6px 0;
    border-bottom:1px dashed var(--line);
    font-size:13.5px;
  }
  .expense-row .e-desc{flex:1;}
  .expense-row .e-amt{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    white-space:nowrap;
  }
  .expense-row .e-del{
    flex:none;
    width:22px; height:22px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink-soft);
    font-size:13px;
    cursor:pointer;
    line-height:1;
  }
  .expense-add{
    display:flex; gap:8px; margin-top:10px;
  }
  .expense-add input{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:13px;
    border:1px solid var(--line);
    border-radius:4px;
    padding:8px 10px;
    background:var(--white);
    color:var(--ink);
  }
  .expense-add .e-desc-input{flex:1; min-width:0;}
  .expense-add .e-amt-input{width:90px; font-family:'JetBrains Mono', monospace;}
  .expense-add button{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    font-weight:700;
    background:var(--ink);
    color:var(--bg);
    border:none;
    border-radius:4px;
    padding:0 14px;
    cursor:pointer;
    touch-action:manipulation;
  }
  .expense-sub{
    display:flex; justify-content:space-between;
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid var(--line);
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    font-weight:700;
  }
  .trip-total{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    text-align:right;
  }
  .trip-total b{color:var(--vermilion); font-size:14px;}

  /* app sections + bottom nav */
  body{padding-bottom:86px;}
  .section{display:none;}
  .section.active{display:block; animation:fade .3s ease;}
  .bottom-nav{
    position:fixed;
    left:0; right:0; bottom:0;
    display:flex;
    background:var(--panel);
    border-top:1px solid var(--line);
    z-index:50;
    padding-bottom:env(safe-area-inset-bottom, 0);
    box-shadow:0 -2px 10px rgba(31,42,60,0.06);
  }
  .nav-btn{
    flex:1;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:10px 0 8px;
    background:none; border:none;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:10.5px;
    color:var(--ink-soft);
    cursor:pointer;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    border-top:2px solid transparent;
  }
  .nav-btn .nav-icon{font-size:19px; line-height:1;}
  .nav-btn.active{color:var(--ink); border-top-color:var(--vermilion);}

  /* category buttons */
  .cat-row{display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 10px;}
  .cat-btn{
    font-size:12px;
    padding:6px 11px;
    border-radius:16px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink-soft);
    cursor:pointer;
    touch-action:manipulation;
  }
  .cat-btn.on{background:var(--ink); color:var(--bg); border-color:var(--ink);}

  /* people chips */
  .people-manage{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    margin-bottom:14px; padding-bottom:14px;
    border-bottom:1px solid var(--line);
  }
  .people-label{
    font-family:'JetBrains Mono', monospace;
    font-size:11px; letter-spacing:0.08em;
    color:var(--ink-soft); flex:none;
  }
  .person-chip{
    display:inline-flex; align-items:center; gap:5px;
    font-size:12.5px;
    padding:5px 6px 5px 12px;
    border-radius:16px;
    border:1px solid var(--line);
    background:var(--white);
  }
  .person-chip .p-del{
    width:16px; height:16px;
    border-radius:50%;
    background:var(--line);
    color:var(--ink-soft);
    font-size:11px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .person-add{display:flex; gap:6px;}
  .person-add input{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:12.5px;
    border:1px solid var(--line);
    border-radius:16px;
    padding:5px 12px;
    width:110px;
    background:var(--white);
    color:var(--ink);
  }
  .person-add button{
    font-size:12px; font-weight:700;
    border:1px solid var(--line);
    border-radius:50%;
    width:26px; height:26px;
    background:var(--white);
    color:var(--ink-soft);
    cursor:pointer;
  }
  .pick-chip{
    font-size:12px;
    padding:6px 12px;
    border-radius:16px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink-soft);
    cursor:pointer;
    touch-action:manipulation;
  }
  .pick-chip.on{background:var(--bg-accent, #E9F0F6); border-color:var(--steel); color:var(--steel); font-weight:700;}
  .field-label{font-size:11.5px; color:var(--ink-soft); margin:10px 0 5px;}
  .field-hint{font-size:11px; color:var(--ink-soft); margin-top:4px;}
  .e-cat{
    font-size:13px;
    margin-right:4px;
  }
  .e-payer{
    font-size:10.5px;
    color:var(--ink-soft);
    display:block;
    margin-top:1px;
  }

  /* settlement */
  .settle-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:14px 0;}
  .settle-card{
    background:var(--white);
    border-radius:6px;
    padding:10px 12px;
    border:1px solid var(--line);
  }
  .settle-name{font-size:12px; color:var(--ink-soft); margin-bottom:2px;}
  .settle-amt{font-family:'JetBrains Mono', monospace; font-weight:700; font-size:15px;}
  .settle-sub{font-size:10.5px; color:var(--ink-soft); margin-top:2px;}
  .settle-row{
    display:flex; align-items:center; gap:8px;
    background:#EAF3E9;
    border-radius:6px;
    padding:9px 12px;
    margin-bottom:8px;
    font-size:13px;
    color:#2E5A32;
  }
  .settle-row b{font-weight:700;}

  .reset-btn{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.04em;
    color:var(--vermilion);
    background:var(--white);
    border:1px solid var(--vermilion);
    border-radius:14px;
    padding:6px 13px;
    cursor:pointer;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
  }
  .reset-row{display:flex; justify-content:flex-end; margin-top:-6px; margin-bottom:14px;}
  .placeholder{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-soft);
    border:1.5px dashed var(--line);
    border-radius:8px;
  }
  .placeholder .big{
    font-family:'Noto Serif JP', serif;
    font-size:20px;
    color:var(--ink);
    margin-bottom:8px;
  }
  footer{
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:40px;
    letter-spacing:0.08em;
  }
  @media (max-width:640px){
    .map-link{font-size:12px;}
    .field-hint{font-size:12px;}
    .e-payer{font-size:11.5px;}
    .settle-sub{font-size:11.5px;}
    .day-sub{font-size:12.5px;}
    .hotel-address{font-size:12.5px;}
    .hotel-right{font-size:12.5px;}
    .eyebrow{font-size:11.5px;}
    .people-label{font-size:12px;}
    .field-label{font-size:12.5px;}
    .d-theme{font-size:12px;}
    .meal-type{font-size:11px;}
  }
  /* driver overlay */
  .driver-btn{margin-top:6px; padding:5px 10px; border-radius:8px; border:1px solid var(--ink-soft); background:transparent; color:var(--ink); font-size:12.5px; cursor:pointer;}
  #driver-overlay{position:fixed; inset:0; z-index:9999; background:var(--bg); color:var(--ink); display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; gap:18px;}
  #driver-overlay.show{display:flex;}
  #driver-overlay .d-lead{font-size:20px;}
  #driver-overlay .d-name{font-size:34px; font-weight:800; line-height:1.3;}
  #driver-overlay .d-en{font-size:18px; color:var(--ink-soft);}
  #driver-overlay .d-addr{font-size:28px; font-weight:700; line-height:1.5;}
  #driver-overlay .d-tel{font-size:22px;}
  #driver-overlay .d-close{margin-top:10px; padding:12px 28px; font-size:16px; border-radius:10px; border:1px solid var(--ink-soft); background:transparent; color:var(--ink);}
  #driver-overlay a{color:var(--ink); text-decoration:underline; font-size:16px;}
  /* shopping list */
  .shop-tabs{display:flex; gap:6px; margin:10px 0 8px;}
  .shop-tabs button{flex:1; padding:9px 0; border:1px solid var(--line); border-radius:10px; background:var(--panel); color:var(--ink-soft); font-size:14.5px; font-family:inherit; cursor:pointer;}
  .shop-tabs button.active{background:var(--ink); color:var(--bg); border-color:var(--ink);}
  .shop-form{display:flex; flex-direction:column; gap:8px; margin-bottom:12px;}
  .shop-row{display:flex; gap:8px;}
  .shop-form input, .shop-form select, #shop-edit input, #shop-edit select{flex:1; min-width:0; padding:10px 12px; font-size:16px; border:1px solid var(--line); border-radius:10px; background:var(--panel); color:var(--ink); font-family:inherit;}
  .shop-addbtn{flex:1; padding:10px 16px; border:none; border-radius:10px; background:var(--vermilion); color:#fff; font-size:15px; cursor:pointer; font-family:inherit;}

// --- 小提示訊息 (toast) ---
function askConfirm(msg){
  return new Promise(res => {
    let o = document.getElementById('ask-confirm');
    if (o) o.remove();
    o = document.createElement('div');
    o.id = 'ask-confirm';
    o.style.cssText = 'position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:24px;';
    o.innerHTML = '<div style="background:var(--bg);color:var(--ink);border-radius:14px;padding:20px;max-width:340px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.25);"><div id="ask-confirm-msg" style="font-size:15px;line-height:1.6;margin-bottom:18px;"></div><div style="display:flex;gap:10px;"><button id="ask-no" style="flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:15px;font-family:inherit;">取消</button><button id="ask-yes" style="flex:1;padding:11px;border-radius:10px;border:none;background:var(--vermilion);color:#fff;font-size:15px;font-family:inherit;">確定</button></div></div>';
    document.body.appendChild(o);
    o.querySelector('#ask-confirm-msg').textContent = msg;
    const done = v => { o.remove(); res(v); };
    o.querySelector('#ask-yes').onclick = () => done(true);
    o.querySelector('#ask-no').onclick = () => done(false);
    o.onclick = e => { if (e.target === o) done(false); };
  });
}
function showToast(msg){
  let toast = document.getElementById('app-toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'app-toast';
    toast.style.cssText = 'position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);font-family:"Zen Kaku Gothic New",sans-serif;font-size:13px;padding:9px 18px;border-radius:20px;z-index:100;opacity:0;transition:opacity .25s ease, transform .25s ease;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,0.2);';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  requestAnimationFrame(() => {
    toast.style.opacity = '1';
    toast.style.transform = 'translateX(-50%) translateY(0)';
  });
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(-50%) translateY(10px)';
  }, 1800);
}

}

function dateStrToISO(dateStr){
  const [m, d] = dateStr.split('/');
  return `2026-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function todayISO(){
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
}

const CURRENCIES = [
  {key:'JPY', sign:'¥'},
  {key:'TWD', sign:'NT$'}
];
function currencySign(key){ return (CURRENCIES.find(c => c.key === key) || CURRENCIES[0]).sign; }
function fmtAmt(amt, currency){ return currencySign(currency) + Math.round(amt).toLocaleString(); }
function shareAmt(e){ return e.splitCount && e.splitCount > 1 ? e.amt / e.splitCount : e.amt; }
function sumByCurrency(list){
  const totals = {};
  list.forEach(e => { const cur = e.currency || 'JPY'; totals[cur] = (totals[cur] || 0) + shareAmt(e); });
  return totals;
}
function fmtTotals(totals){
  const parts = Object.keys(totals).map(cur => fmtAmt(totals[cur], cur));
  return parts.length ? parts.join('　／　') : '¥0';
}

const RATE_KEY = 'fukuoka_exchange_rate_v1';
function loadRate(){
  try {
    const raw = localStorage.getItem(RATE_KEY);
    return raw ? parseFloat(raw) : 0.198;
  } catch(e){ return 0.198; }
}
function saveRate(){
  try { localStorage.setItem(RATE_KEY, String(exchangeRate)); } catch(e){}
}
let exchangeRate = loadRate(); // 1 JPY = exchangeRate TWD
function convertAmt(amt, fromCur){
  if (fromCur === 'JPY') return amt * exchangeRate;
  if (fromCur === 'TWD') return amt / exchangeRate;
  return amt;
}
function otherCur(cur){ return cur === 'JPY' ? 'TWD' : 'JPY'; }
function fmtConverted(amt, fromCur){
  const to = otherCur(fromCur);
  return `≈ ${fmtAmt(convertAmt(amt, fromCur), to)}`;
}
function onRateChange(){
  const input = document.getElementById('exchange-rate-input');
  const v = parseFloat(input.value);
  if (!isNaN(v) && v > 0) { exchangeRate = v; saveRate(); renderExpenses(); if (typeof renderShop === 'function') renderShop(); }
}

function toTwdJpy(amt, fromCur){
  const twd = fromCur === 'TWD' ? amt : convertAmt(amt, 'JPY');
  const jpy = fromCur === 'JPY' ? amt : convertAmt(amt, 'TWD');
  return {twd, jpy};
}
function totalsToTwdJpy(totals){
  const twd = (totals.TWD || 0) + convertAmt(totals.JPY || 0, 'JPY');
  const jpy = (totals.JPY || 0) + convertAmt(totals.TWD || 0, 'TWD');
  return {twd, jpy};
}
function fmtRowAmt(amt, fromCur){
  return fromCur === 'JPY' ? `¥${Math.round(amt).toLocaleString()}` : `NT$${Math.round(amt).toLocaleString()}`;
}
// 依幣別各自顯示，不做換算（日幣在上、台幣在下）
function fmtNative(totals){
  const parts = [];
  if (totals.JPY) parts.push(`¥${Math.round(totals.JPY).toLocaleString()}`);
  if (totals.TWD) parts.push(`NT$${Math.round(totals.TWD).toLocaleString()}`);
  return parts.length ? parts.join('<br>') : '—';
}
function fmtTwdMain(totals, noConvert){
  const {twd, jpy} = totalsToTwdJpy(totals);
  if (noConvert) return `NT$${Math.round(twd).toLocaleString()}`;
  return `NT$${Math.round(twd).toLocaleString()}<span class="e-payer" style="display:block;text-align:right;">（≈¥${Math.round(jpy).toLocaleString()}）</span>`;
}
function fmtTwdOneLine(totals){
  const {twd} = totalsToTwdJpy(totals);
  return `約 NT$${Math.round(twd).toLocaleString()}`;
}

let editingIndex = null;

function submitExpense(){
  const dateInput = document.getElementById('e-date');
  const date = dateInput.value;
  const amtInput = document.getElementById('e-amt');
  const noteInput = document.getElementById('e-note');
  const amt = parseFloat(amtInput.value);
  if (isNaN(amt) || amt <= 0) return;
  const entry = {
    date, amt,
    note: noteInput.value.trim(),
    category: lastCategory,
    paymentMethod: lastPaymentMethod,
    currency: lastCurrency
  };
  if (editingIndex !== null) {
    expenseEntries[editingIndex] = entry;
    editingIndex = null;
    document.getElementById('add-expense-btn').textContent = '加入';
    document.getElementById('cancel-edit-row').style.display = 'none';
    showToast('已更新這筆花費 ✓');
  } else {
    expenseEntries.push(entry);
    showToast('已新增一筆花費 ✓');
  }
  amtInput.value = '';
  noteInput.value = '';
  saveExpenses();
  renderExpenses();
  const summaryEl = document.getElementById('summary-totals');
  if (summaryEl && summaryEl.scrollIntoView) summaryEl.scrollIntoView({behavior:'smooth', block:'center'});
}

function editExpense(idx){
  const e = expenseEntries[idx];
  if (!e) return;
  editingIndex = idx;
  document.getElementById('e-date').value = e.date;
  document.getElementById('e-amt').value = e.amt;
  document.getElementById('e-note').value = e.note || '';
  lastCategory = e.category;
  lastPaymentMethod = e.paymentMethod;
  lastCurrency = e.currency;
  renderPickerRows();
  document.getElementById('add-details').open = true;
  document.getElementById('add-expense-btn').textContent = '更新這一筆';
  document.getElementById('cancel-edit-row').style.display = 'block';

function deleteExpense(idx){
  expenseEntries.splice(idx, 1);

  else if (editingIndex !== null && idx < editingIndex) editingIndex--;

  renderExpenses();
}

async function importExpenses(){
  const text = document.getElementById('import-textarea').value.trim();
  if (!text) return;
  let parsed;
  try { parsed = JSON.parse(text); }
  catch(e) { alert('格式不對，請確認貼上的是完整的備份文字'); return; }
  const list = Array.isArray(parsed) ? parsed : parsed.expenseEntries;
  if (!Array.isArray(list)) { alert('格式不對，請確認貼上的是完整的備份文字'); return; }
  const extras = [];
  if (!Array.isArray(parsed) && parsed.exchangeRate) extras.push(`匯率 ¥1=NT$${parsed.exchangeRate}`);
  if (!Array.isArray(parsed) && parsed.budgetTwd) extras.push(`預算 NT$${parsed.budgetTwd}`);
  if (!Array.isArray(parsed) && Array.isArray(parsed.customCategories) && parsed.customCategories.length) extras.push(`${parsed.customCategories.length} 個自訂分類`);
  const extraMsg = extras.length ? `，並還原 ${extras.join('、')}` : '';
  if (!(await askConfirm(`確定要加入 ${list.length} 筆記錄嗎${extraMsg}？`))) return;
  expenseEntries = expenseEntries.concat(list);
  saveExpenses();
  if (!Array.isArray(parsed)) {
    if (typeof parsed.exchangeRate === 'number' && parsed.exchangeRate > 0) {
      exchangeRate = parsed.exchangeRate;
      saveRate();
      const rateInput = document.getElementById('exchange-rate-input');
      if (rateInput) rateInput.value = exchangeRate;
    }
    if (typeof parsed.budgetTwd === 'number' && parsed.budgetTwd > 0) {
      budgetTwd = parsed.budgetTwd;
      saveBudget();
      const budgetInput = document.getElementById('budget-input');
      if (budgetInput) budgetInput.value = budgetTwd;
    }
    if (Array.isArray(parsed.customCategories) && parsed.customCategories.length) {
      parsed.customCategories.forEach(c => {
        if (c && c.key && !customCategories.some(existing => existing.key === c.key)) customCategories.push(c);
      });
      saveCustomCategories();
      renderPickerRows();
    }
  }
  document.getElementById('import-textarea').value = '';
  document.getElementById('import-box').style.display = 'none';
  renderExpenses();
  showToast('匯入完成 ✓');
}

function renderCurrencyGroups(){

function renderExpenses(){
  const groupsEl = document.getElementById('expense-groups');
  const grandEl = document.getElementById('expense-grand-total');
  if (!groupsEl) return;

  const fixedTotals = renderFixedExpenses();
  renderCurrencyGroups();

  const withIdx = expenseEntries.map((e, idx) => ({...e, idx}))
    .sort((a,b) => (b.date || '').localeCompare(a.date || ''));

  groupsEl.innerHTML = withIdx.length ? withIdx.map(e => {
    const c = catInfo(e.category);
    const pm = PAYMENT_METHODS.find(m => m.key === e.paymentMethod) || PAYMENT_METHODS[0];

        <span class="e-del" onclick="deleteExpense(${e.idx})">×</span>
      </div>`;

  const dynamicTotals = sumByCurrency(expenseEntries);
  const grandTotals = {};
  Object.keys(fixedTotals).forEach(cur => { grandTotals[cur] = (grandTotals[cur] || 0) + fixedTotals[cur]; });
  Object.keys(dynamicTotals).forEach(cur => { grandTotals[cur] = (grandTotals[cur] || 0) + dynamicTotals[cur]; });
  const totalInTwd = (grandTotals.JPY ? convertAmt(grandTotals.JPY, 'JPY') : 0) + (grandTotals.TWD || 0);

  grandEl.innerHTML = '';
  const convertedGrandEl = document.getElementById('expense-grand-converted');
  if (convertedGrandEl) convertedGrandEl.textContent = '';
  const headerTotal = document.getElementById('trip-total-amt');
  if (headerTotal) headerTotal.textContent = fmtTwdOneLine(grandTotals);

  // 摘要卡片
  const summaryTotalsEl = document.getElementById('summary-totals');
  const summaryConvertedEl = document.getElementById('summary-converted');
  if (summaryTotalsEl) summaryTotalsEl.textContent = `約 NT$${Math.round(totalInTwd).toLocaleString()}`;
  if (summaryConvertedEl) summaryConvertedEl.innerHTML = grandTotals.JPY ? `日幣依 ¥1 = NT$${exchangeRate} 換算　<span style="text-decoration:underline;cursor:pointer;color:var(--steel);" onclick="openRateFold()">修改匯率</span>` : '';

    subEl2.innerHTML = rows.join('');
  }

  // 預算進度
  const progressEl = document.getElementById('budget-progress');
  if (progressEl) {
    if (budgetTwd > 0) {
      const pct = Math.min(100, Math.round((totalInTwd / budgetTwd) * 100));

      const over = remaining < 0;
      progressEl.innerHTML = `
        <div style="background:var(--white);border:1px solid var(--line);border-radius:8px;height:10px;overflow:hidden;margin-bottom:6px;">
          <div style="width:${pct}%;height:100%;background:${over ? 'var(--vermilion)' : 'var(--moss)'};"></div>

function openPhotoDB(){
  return new Promise(res => {
    try {
      const rq = indexedDB.open('fukuoka_photos', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('p');
      rq.onsuccess = () => { photoDB = rq.result; res(true); };
      rq.onerror = () => res(false);

  });
}
function idbPut(id, data){
  return new Promise(res => {
    if (!photoDB) return res(false);
    try {
      const tx = photoDB.transaction('p','readwrite');
      tx.objectStore('p').put(data, id);
      tx.oncomplete = () => res(true);
      tx.onerror = tx.onabort = () => res(false);
    } catch(e){ res(false); }
  });
}
function idbDel(id){ try { if (photoDB) photoDB.transaction('p','readwrite').objectStore('p').delete(id); } catch(e){} }
function idbLoadAll(){
  return new Promise(res => {
    if (!photoDB) return res();
    try {
      const rq = photoDB.transaction('p').objectStore('p').openCursor();
      rq.onsuccess = () => { const c = rq.result; if (c){ photoCache[c.key] = c.value; c.continue(); } else res(); };
      rq.onerror = () => res();
    } catch(e){ res(); }
  });
}

function readPhoto(file){
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1280, r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}

  }
  if (shopSearch.trim() && !vis.length) listHtml = '<div class="shop-empty">找不到符合的項目</div>';
  const d = shopDraft;
  shopPanel.innerHTML = `
    <h2 class="day-title">日本購物清單</h2>
    <span class="day-sub">${tabItems.length ? `還有 ${left} 項沒買` : '想到什麼就先記下來，逛街時邊買邊勾'}</span>
    <div class="shop-tabs">
      <button class="${isMe?'active':''}" onclick="setShopTab('me')">自己要買</button>
      <button class="${!isMe?'active':''}" onclick="setShopTab('other')">幫別人買</button>
    </div>
    <div class="shop-area">搜尋地區：<input type="text" value="${escHtml(searchArea)}" placeholder="例如 福岡、大阪、Paris" onchange="setSearchArea(this.value)"><span>店名搜尋會自動加上這個地區；換地方旅行時改這裡</span></div>
    ${tabItems.length > 4 || shopSearch ? `<input id="shop-search" class="shop-search" type="search" placeholder="🔍 搜尋清單（品名、店名、誰…）" value="${escHtml(shopSearch)}" oninput="onShopSearch(this)">` : ''}
    <div class="shop-quick">
      <button class="shop-quick-title" onclick="toggleShopQuick()">📍 附近搜尋 ${shopQuickOpen ? '▴' : '▾'}</button>
      ${shopQuickOpen ? `<div class="shop-quick-hint">用目前位置在地圖找最近的店</div><div class="shop-quick-row">${SHOP_QUICK.map(q => `<a href="${shopMapUrl(q[1])}" target="_blank" rel="noopener">${q[0]}</a>`).join('')}</div>` : ''}
    </div>
    <div class="shop-form">
      <div class="shop-row">
        ${isMe ? '' : `<input id="shop-who" type="text" placeholder="誰" value="${escHtml(d.who)}" oninput="shopDraft.who=this.value" style="flex:0 0 72px">`}
        <input id="shop-input" type="text" placeholder="${isMe?'想買的東西（或只填下面店名）':'要買什麼'}" value="${escHtml(d.text)}" oninput="shopDraft.text=this.value" onkeydown="if(event.key==='Enter')addShop()">
      </div>
      ${!isMe && whoList.length ? `<div class="who-chips"><span>常用：</span>${whoList.map((w,i) => `<button class="${d.who===w?'active':''}" onclick="pickWho(${i})">${escHtml(w)}</button>`).join('')}</div>` : ''}
      <div class="shop-row">
        <input type="text" placeholder="店名（選填，只有特定店家才有時填）" value="${escHtml(d.store)}" oninput="shopDraft.store=this.value">
      </div>
      <button class="shop-more-toggle" onclick="toggleShopMore()">${shopMoreOpen() ? '收起 ▴' : '更多選項（備註、價格…）▾'}</button>
      ${shopMoreOpen() ? `
      <div class="shop-row">
        <input type="text" placeholder="備註（規格、口味、尺寸…）" value="${escHtml(d.note)}" oninput="shopDraft.note=this.value">
      </div>
      <div class="shop-row">
        <input type="number" inputmode="numeric" placeholder="單價 ¥" value="${escHtml(d.price)}" oninput="shopDraft.price=this.value" style="flex:1.2">
        <input type="number" inputmode="numeric" placeholder="數量" value="${escHtml(d.qty)}" oninput="shopDraft.qty=this.value" style="flex:0.8">
      </div>` : ''}
      <div class="shop-row">
        <button class="shop-cam" onclick="document.getElementById('shop-file').click()" aria-label="加照片">${shopPendingPhoto ? `<img src="${shopPendingPhoto}" alt="">` : '📷'}</button>
        <button class="shop-addbtn" onclick="addShop()">加入</button>
      </div>
      <input id="shop-file" type="file" accept="image/*" style="display:none" onchange="onShopPhoto(this)">
    </div>
    ${totalAll > 0 ? `<div class="shop-sum"><div>預估總額　<b>${priceBoth(totalAll)}</b></div><div>還沒買　<b>${priceBoth(totalLeft)}</b></div></div>` : ''}
    ${isMe ? (shopBudget > 0 || shopBudgetEdit ? `<div class="shop-budget">購物預算（自己要買）NT$ <input id="shop-budget-in" type="number" inputmode="numeric" value="${shopBudget || ''}" placeholder="輸入金額" onchange="setShopBudget(this.value)" onblur="if(!this.value){shopBudgetEdit=false;renderShop();}">
      ${shopBudget > 0 ? (() => { const all = shopItems.filter(x => (x.type || 'me') === 'me').reduce((t,x)=>t+itemTotal(x),0) * exchangeRate; const diff = shopBudget - all; return `<div class="shop-budget-bar"><i style="width:${Math.min(100, Math.round(all/shopBudget*100))}%" class="${diff<0?'over':''}"></i></div><div class="shop-budget-txt${diff<0?' over':''}">自己要買預估 ≈${fmtTwd(all)}・${diff<0?'超出':'還剩'} ${fmtTwd(Math.abs(diff))}</div>`; })() : ''}
    </div>` : `<button class="shop-budget-link" onclick="openShopBudget()">＋ 設定購物預算</button>`) : ''}    ${listHtml || '<div class="shop-empty">目前還沒有項目</div>'}
    ${!isMe ? settleHtml() : ''}
    <div class="shop-opts">
      <label><input type="checkbox" ${shopAskExp?'checked':''} onchange="toggleAskExp()"> 勾選已買時詢問實際價格與照片</label>
    </div>
    <div class="shop-tools">
      <button onclick="copyShopText()">複製清單文字</button>
      <button onclick="clearBoughtShop()">清掉已買</button>
      <button onclick="backupShop()">備份</button>
      <button onclick="document.getElementById('shop-restore').click()">還原</button>
      <input id="shop-restore" type="file" accept=".json,application/json" style="display:none" onchange="restoreShop(this)">
    </div>
    <div class="note-box" style="margin-top:14px">清單和照片存在這支手機的瀏覽器裡，換手機或清除瀏覽資料就會消失。出發前建議按「備份」存一份檔案。</div>`;
}
function setShopTab(t){ shopTab = t; shopFilter = ''; renderShop(); }
function setShopFilter(p){ shopFilter = p; renderShop(); }

async function addShop(){
  const text = shopDraft.text.trim();
  const storeOnly = !text && shopTab === 'me' && shopDraft.store.trim();
  if (!text && !storeOnly) { showToast(shopTab === 'me' ? '請輸入想買的東西，或至少填店名' : '請先輸入品項'); return; }
  const item = {id:newShopId(), text, done:false, type:shopTab};
  if (shopTab === 'other'){
    item.who = shopDraft.who.trim();
    if (!item.who){ showToast('請先填「誰」'); const w = document.getElementById('shop-who'); if (w) w.focus(); return; }
  }
  if (shopDraft.store.trim()) item.store = shopDraft.store.trim();
  if (shopDraft.note.trim()) item.note = shopDraft.note.trim();
  const price = parseFloat(shopDraft.price); if (price > 0) item.price = price;
  const qty = parseInt(shopDraft.qty, 10); if (qty > 1) item.qty = qty;
  if (shopPendingPhoto) Object.assign(item, await storePhoto(shopPendingPhoto));
  if (item.who) rememberWho(item.who);
  shopItems.push(item);
  if (!saveShop()){ shopItems.pop(); dropPhoto(item); showToast('空間不足，存不下這筆'); return; }
  shopPendingPhoto = null;
  shopDraft.text = ''; shopDraft.store = ''; shopDraft.note = ''; shopDraft.price = ''; shopDraft.qty = '1';
  renderShop();
  const inp = document.getElementById('shop-input'); if (inp) inp.focus();
}
async function onShopPhoto(inp){
  const f = inp.files && inp.files[0];
  if (!f) return;
  try { shopPendingPhoto = await readPhoto(f); renderShop(); } catch(e){ showToast('無法讀取這張照片'); }
}
function findShop(id){ return shopItems.find(it => it.id === id); }
function toggleShop(id){
  const it = findShop(id); if (!it) return;
  it.done = !it.done; saveShop(); renderShop();
  if (it.done && !shopDoneOpen && !shopSearch.trim()) showToast('已移到下方「已買」');
  if (it.done && shopAskExp) openBuy(it.id);
}
function delShop(id){
  const idx = shopItems.findIndex(x => x.id === id);
  if (idx < 0) return;
  const it = shopItems[idx];
  shopItems.splice(idx, 1);
  saveShop(); renderShop();
  showUndo(`已刪除「${itemTitle(it)}」`, () => { shopItems.splice(Math.min(idx, shopItems.length), 0, it); saveShop(); renderShop(); }, () => dropAllPhotos(it));
}
function showUndo(msg, onUndo, onExpire){
  let t = document.getElementById('undo-bar');
  if (t){ clearTimeout(t._t); if (t._expire) t._expire(); t.remove(); }
  t = document.createElement('div');
  t.id = 'undo-bar';
  t.style.cssText = 'position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:9990;background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 14px 10px 18px;font-size:14px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:92vw;';
  t.innerHTML = '<span></span><button style="background:none;border:none;color:var(--gold);font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;padding:2px 4px;">復原</button>';
  t.firstChild.textContent = msg;
  let finished = false;
  const finish = () => { if (finished) return; finished = true; t.remove(); };
  t._expire = () => { if (!finished){ finished = true; onExpire && onExpire(); } };
  t.querySelector('button').onclick = () => { if (finished) return; finished = true; clearTimeout(t._t); t.remove(); onUndo && onUndo(); };
  t._t = setTimeout(() => { if (!finished){ finished = true; t.remove(); onExpire && onExpire(); } }, 6000);
  document.body.appendChild(t);
}
async function clearBoughtShop(){
  const done = shopItems.filter(it => it.done && (it.type || 'me') === shopTab);
  if (!done.length){ showToast('目前沒有已買的項目'); return; }
  if (!(await askConfirm(`清掉 ${done.length} 個已買項目？`))) return;
  done.forEach(dropAllPhotos);
  shopItems = shopItems.filter(it => !done.includes(it));
  saveShop(); renderShop();
}
function viewShopPhoto(id, direct){
  const it = findShop(id);
  const src = direct || (it && photoSrc(it));
  if (!src) return;
  let o = document.getElementById('shop-photo-overlay');
  if (!o){
    o = document.createElement('div');
    o.id = 'shop-photo-overlay';
    o.onclick = () => o.classList.remove('show');
    document.body.appendChild(o);
  }
  o.innerHTML = `<img src="${src}" alt="">`;
  o.classList.add('show');
}

// 編輯
function openShopEdit(id){
  const it = findShop(id); if (!it) return;
  shopEditId = id; shopEditPhoto = undefined;
  let o = document.getElementById('shop-edit');
  if (!o){ o = document.createElement('div'); o.id = 'shop-edit'; document.body.appendChild(o); }
  const isOther = (it.type || 'me') === 'other';
  o.innerHTML = `
    <div class="se-card">
      <div class="se-title">編輯項目</div>
      ${isOther ? `<input id="se-who" type="text" placeholder="誰" value="${escHtml(it.who || '')}">` : ''}
      <input id="se-text" type="text" placeholder="品項" value="${escHtml(it.text)}">
      <input id="se-store" type="text" placeholder="店名（選填）" value="${escHtml(it.store || '')}">
      <input id="se-note" type="text" placeholder="備註" value="${escHtml(it.note || '')}">
      <div class="shop-row">
        <input id="se-price" type="number" inputmode="numeric" placeholder="單價 ¥" value="${it.price || ''}">
        <input id="se-qty" type="number" inputmode="numeric" placeholder="數量" value="${it.qty || 1}">
      </div>
      <div class="shop-row se-photo">
        <div id="se-photo-prev">${photoSrc(it) ? `<img src="${photoSrc(it)}" alt="">` : '<span>無照片</span>'}</div>
        <button onclick="document.getElementById('se-file').click()">換照片</button>
        <button onclick="removeEditPhoto()">移除</button>
        <input id="se-file" type="file" accept="image/*" style="display:none" onchange="onEditPhoto(this)">
      </div>
      <div class="shop-row">
        <button class="se-cancel" onclick="closeShopEdit()">取消</button>
        <button class="se-save" onclick="saveShopEdit()">儲存</button>
      </div>
    </div>`;
  o.classList.add('show');
}
function closeShopEdit(){ const o = document.getElementById('shop-edit'); if (o) o.classList.remove('show'); shopEditId = null; }
async function onEditPhoto(inp){
  const f = inp.files && inp.files[0]; if (!f) return;
  try {
    shopEditPhoto = await readPhoto(f);
    document.getElementById('se-photo-prev').innerHTML = `<img src="${shopEditPhoto}" alt="">`;
  } catch(e){ showToast('無法讀取這張照片'); }
}
function removeEditPhoto(){ shopEditPhoto = null; document.getElementById('se-photo-prev').innerHTML = '<span>無照片</span>'; }
async function saveShopEdit(){
  const it = findShop(shopEditId); if (!it) return closeShopEdit();
  const text = document.getElementById('se-text').value.trim();
  const storeChk = document.getElementById('se-store').value.trim();
  if (!text && !(storeChk && (it.type || 'me') === 'me')){ showToast('品項不能是空的'); return; }
  const whoEl = document.getElementById('se-who');
  if (whoEl){ const w = whoEl.value.trim(); if (!w){ showToast('請填「誰」'); return; } it.who = w; }
  it.text = text;
  const store = document.getElementById('se-store').value.trim();
  if (store) it.store = store; else delete it.store;
  const note = document.getElementById('se-note').value.trim();
  if (note) it.note = note; else delete it.note;
  const price = parseFloat(document.getElementById('se-price').value);
  if (price > 0) it.price = price; else delete it.price;
  const qty = parseInt(document.getElementById('se-qty').value, 10);
  if (qty > 1) it.qty = qty; else delete it.qty;
  if (shopEditPhoto !== undefined){
    dropPhoto(it);
    if (shopEditPhoto) Object.assign(it, await storePhoto(shopEditPhoto));
  }
  saveShop(); closeShopEdit(); renderShop();
}

// 匯出文字
function shopListText(){
  const items = shopItems.filter(it => (it.type || 'me') === shopTab);
  const line = it => {
    const q = Number(it.qty) || 1;
    let t = `${it.done ? '☑' : '☐'} ${itemTitle(it)}${q > 1 ? ' ×' + q : ''}`;
    const extra = [];
    if (it.store) extra.push(it.store);
    if (itemTotal(it) > 0) extra.push(fmtYen(itemTotal(it)));
    if (it.note) extra.push(it.note);
    if (extra.length) t += `（${extra.join('・')}）`;
    return t;
  };
  if (shopTab === 'me') return `【福岡購物清單｜自己要買】\n` + sortUndoneFirst(items).map(line).join('\n');
  const groups = {};
  items.forEach(it => { const w = it.who || '未指定'; (groups[w] = groups[w] || []).push(it); });
  return `【福岡購物清單｜幫別人買】\n` + Object.keys(groups).map(w => `\n▍${w}\n` + sortUndoneFirst(groups[w]).map(line).join('\n')).join('\n');
}
async function copyShopText(){
  if (!shopItems.some(it => (it.type || 'me') === shopTab)){ showToast('清單是空的'); return; }
  const txt = shopListText();
  try { await navigator.clipboard.writeText(txt); showToast('已複製，可以貼到 LINE'); return; } catch(e){}
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
  showToast(ok ? '已複製，可以貼到 LINE' : '複製失敗，請改用備份');
}

// 備份／還原（含照片）
function backupShop(){
  if (!shopItems.length){ showToast('清單是空的，不需要備份'); return; }
  const data = {app:'fukuoka-shopping', version:1, exportedAt:new Date().toISOString(),
    items: shopItems.map(it => { const c = Object.assign({}, it); if (c.photoId){ c.photoData = photoCache[c.photoId] || ''; } if (c.receipts){ c.receiptsData = c.receipts.map(entrySrc).filter(Boolean); delete c.receipts; } return c; })};
  const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
  const a = document.createElement('a');
  const d = new Date();
  a.href = URL.createObjectURL(blob);
  a.download = `福岡購物清單備份_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  showToast('已產生備份檔，請存到「檔案」或雲端');
}
function restoreShop(inp){
  const f = inp.files && inp.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = async () => {
    try {
      const data = JSON.parse(rd.result);
      if (!data || data.app !== 'fukuoka-shopping' || !Array.isArray(data.items)) throw new Error('bad');
      if (!(await askConfirm(`還原 ${data.items.length} 個項目？目前的購物清單會被取代。`))) { inp.value = ''; return; }
      shopItems.forEach(dropAllPhotos);
      const out = [];
      for (const raw of data.items){
        const it = Object.assign({}, raw);
        const pd = it.photoData; delete it.photoData;
        if (!it.id) it.id = newShopId();
        if (pd){ delete it.photoId; Object.assign(it, await storePhoto(pd)); }
        migrateReceipts(it);
        if (it.priced){ it.actualTotal = (Number(it.price) || 0) * (Number(it.qty) || 1); delete it.price; delete it.priced; }
        const rd2 = it.receiptsData; delete it.receiptsData; delete it.receipts;
        if (rd2 && rd2.length){ it.receipts = []; for (const d of rd2) it.receipts.push(await storeEntry(d)); }
        out.push(it);
      }
      shopItems = out; saveShop(); renderShop();
      showToast('已還原');
    } catch(e){ showToast('這不是有效的備份檔'); }
    inp.value = '';
  };
  rd.readAsText(f);
}
renderShop();
openPhotoDB().then(idbLoadAll).then(renderShop);

function selectSection(sec){
  document.querySelectorAll('.section').forEach(s => s.classList.toggle('active', s.id === 'section-' + sec));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.section === sec));
}
selectSection('itinerary');

// 左右滑動切換 DAY
(function enableSwipe(){
  let startX = 0, startY = 0, tracking = false;
  panels.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    tracking = true;
  }, {passive:true});
  panels.addEventListener('touchend', (e) => {
    if (!tracking) return;
    tracking = false;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    const idx = parseInt(currentDayKey, 10);
    if (isNaN(idx)) return;
    if (dx < 0 && idx < days.length - 1) selectPanel(String(idx + 1));
    else if (dx > 0 && idx > 0) selectPanel(String(idx - 1));
  }, {passive:true});
})();

panels.addEventListener('click', (e) => {
  const btn = e.target.closest('.plan-btn');
  if (!btn) return;
  const pi = btn.dataset.pi;
  const block = btn.closest('.plan-block');
  block.querySelectorAll(`.plan-btn[data-pi="${pi}"]`).forEach(b => b.classList.toggle('on', b === btn));
  block.querySelectorAll(`.plan-body[data-pi="${pi}"]`).forEach(b => b.classList.toggle('on', b.dataset.oi === btn.dataset.oi));
});

// 外部連結：預覽視窗可能擋掉新分頁，擋住時改成複製連結
document.addEventListener('click', function(ev){
  const a = ev.target.closest && ev.target.closest('a[target="_blank"]');
  if (!a || !/^https?:/i.test(a.href)) return;
  ev.preventDefault();
  let w = null;
  try { w = window.open(a.href, '_blank'); } catch(e){}
  if (w){ try { w.opener = null; } catch(e){} return; }
  const done = ok => showToast(ok ? '這個預覽視窗擋住了連結，已複製網址，請貼到瀏覽器開啟' : '連結被擋住了，請用瀏覽器直接開啟這個網頁');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(a.href).then(() => done(true), () => done(false));
  else done(false);
}, true);

// 輸入框清除鈕：用輸入框自己的背景圖畫 ✕（不另外浮動元件，捲動不會跑位），點右側就清空
(function(){
  const okEl = el => el.tagName === 'INPUT' && ['text','number','search'].includes(el.type) && !el.readOnly && !el.disabled && el.id !== 'shop-who' && el.placeholder !== '數量';
  let queued = false;
  function sync(){
    queued = false;
    document.querySelectorAll('input').forEach(el => {
      if (!okEl(el)) return;
      el.classList.toggle('has-val', !!el.value && el.offsetWidth >= 90);
    });
  }
  function schedule(){ if (!queued){ queued = true; requestAnimationFrame(sync); } }
  document.addEventListener('input', schedule, true);
  document.addEventListener('change', schedule, true);
  new MutationObserver(schedule).observe(document.body, {childList: true, subtree: true});
  document.addEventListener('pointerdown', e => {
    const el = e.target;
    if (!el || !el.classList || !el.classList.contains('has-val') || !el.value) return;
    const r = el.getBoundingClientRect();
    if (e.clientX < r.right - 38) return;
    e.preventDefault();
    el.value = '';
    el.dispatchEvent(new Event('input', {bubbles: true}));
    if (el.hasAttribute('onchange')) el.dispatchEvent(new Event('change', {bubbles: true}));
    if (document.body.contains(el)) el.focus();
    schedule();
  }, true);
  schedule();
})();
